<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c15"><title>NEXORA | Randomizer</title>
<link rel="icon" href="./image/icon.png"><link rel="stylesheet" href="./nexora-unified.css?v=1">
<style>
:root{color-scheme:dark;--muted:#a5b3d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#eef3ff;background:#080c15;font:14px/1.55 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:22px 15px 80px}header,.row,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header{padding:14px 18px;border:1px solid #b4c9ff2a;border-radius:17px;background:#141d2bc9;backdrop-filter:blur(20px)}a{color:#b9caff;text-decoration:none}h1{font-size:clamp(28px,5vw,44px);margin:28px 0 5px}h2{font-size:19px}.muted{color:var(--muted)}.glass{padding:20px;margin-top:20px;background:#131c30d9;border:1px solid #b4c9ff26;border-radius:20px;backdrop-filter:blur(20px)}.pill{display:inline-flex;border:1px solid #b4c9ff26;border-radius:14px;padding:4px;background:#0c1525}.pill button{background:transparent;border:0;padding:10px 16px;color:#d6dfff;border-radius:10px;cursor:pointer}.pill button.active{background:#637fe5;color:#fff}.tools input{flex:1;min-width:170px}input,select{padding:12px;border:1px solid #ffffff30;background:#0c1526;color:#fff;border-radius:12px;font:inherit}input[type=number]{width:75px}button{cursor:pointer;border:1px solid #ffffff30;border-radius:12px;background:#253452;color:white;padding:11px 15px;font:inherit}button.primary{background:linear-gradient(115deg,#5979e9,#906fdf);border:0;font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-height:350px;overflow:auto;margin-top:14px}.user{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;padding:10px;background:#ffffff08;border:1px solid #ffffff15;border-radius:13px}.user[aria-pressed=true]{border-color:#94aaff;background:#7288ed33}.avatar{width:39px;height:39px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#516dd2,#8b64bb);display:grid;place-items:center;flex-shrink:0;font-weight:800}.who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{display:block;color:#a6b6d5;overflow:hidden;text-overflow:ellipsis}.case{position:relative;overflow:hidden;margin:18px 0;padding:24px 0;background:#080e1d;border:1px solid #819bff33;border-radius:18px}.case::before,.case::after{content:"";position:absolute;z-index:2;top:0;bottom:0;width:25%;pointer-events:none}.case::before{left:0;background:linear-gradient(90deg,#080e1d,transparent)}.case::after{right:0;background:linear-gradient(270deg,#080e1d,transparent)}.marker{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:3px;background:#a5b6ff;box-shadow:0 0 18px #a5b6ff}.reel{display:flex;gap:12px;transform:translateX(0);will-change:transform}.tile{flex:0 0 150px;min-height:125px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:12px;border:1px solid #b4c9ff29;border-radius:16px;background:linear-gradient(140deg,#23345d,#151c32)}.tile .avatar{width:52px;height:52px}.tile b{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.winners{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.winner{padding:13px;border:1px solid #829aff50;border-radius:15px;background:#7e95ff16}.winner b{color:#c7d3ff}#notice{min-height:23px;color:#c5d1ff}.count{font-size:13px;color:#aebfe1}@media(max-width:600px){.glass{padding:14px}.tools{align-items:stretch}.tools input{width:100%}.pill{width:100%;display:flex}.pill button{flex:1}.tile{flex-basis:126px}}@media(prefers-reduced-motion:reduce){.reel{transition:none!important}}
</style></head>
<body data-nx-page="randomizer"><main>
<header><a href="./index.html">✦ NEXORA</a><span class="muted">RANDOMIZER · CASE ROLL</span><a href="./index.html">← Главная</a></header>
<h1>Рандомайзер</h1><p class="muted">Случайный выбор пользователей с анимацией открытия кейса. От 1 до 10 победителей.</p>
<div id="notice" role="status">Подключение к NEXORA…</div>
<section class="glass"><div class="row"><h2>Участники</h2><div class="pill"><button id="allMode" class="active" type="button">Все пользователи</button><button id="selectedMode" type="button">Выбранные</button></div></div>
<div class="tools"><input id="search" type="search" placeholder="Поиск по имени или @username" aria-label="Поиск пользователей"><button id="selectVisible" hidden>Выбрать найденных</button><button id="clearSelection" hidden>Сбросить выбор</button><span id="poolCount" class="count"></span></div>
<div id="users" class="grid"><p class="muted">Загрузка пользователей…</p></div></section>
<section class="glass"><div class="row"><label>Количество победителей <input id="count" type="number" min="1" max="10" value="1"></label><button id="roll" class="primary" disabled>✦ Открыть кейс</button></div>
<div class="case"><div class="marker"></div><div id="reel" class="reel"><div class="tile">✦ NEXORA</div></div></div><p id="progress" class="muted">Выбери режим и запусти розыгрыш.</p>
<div class="row"><h2>Результаты</h2><button id="copy" hidden>Копировать</button></div><div id="winners" class="winners"></div></section>
</main><script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyD9prfvOQGMeniL3U8WD2HeeZ6NNArY8J8",authDomain:"toolchat-bfac8.firebaseapp.com",projectId:"toolchat-bfac8",storageBucket:"toolchat-bfac8.firebasestorage.app",messagingSenderId:"52396840735",appId:"1:52396840735:web:a608b9c037c8481f2dc22a"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let users=[],selected=new Set(),mode="all",busy=false,winners=[];
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const name=u=>u.name||u.username||"Пользователь";
const handle=u=>u.username?"@"+u.username:"";
function avatar(u){const src=typeof u.avatarUrl==="string"&&/^https:\/\//.test(u.avatarUrl)?u.avatarUrl:"";return src?'<img class="avatar" alt="" loading="lazy" referrerpolicy="no-referrer" src="'+esc(src)+'">':'<span class="avatar">'+esc(name(u).slice(0,1).toUpperCase())+'</span>'}
function pool(){return mode==="all"?users:users.filter(u=>selected.has(u.id))}
function note(t){$("notice").textContent=t}
function render(){const q=$("search").value.toLowerCase().trim(),found=users.filter(u=>(name(u)+" "+handle(u)).toLowerCase().includes(q));$("users").innerHTML=found.length?found.map(u=>'<button type="button" class="user" data-uid="'+esc(u.id)+'" aria-pressed="'+selected.has(u.id)+'">'+avatar(u)+'<span class="who"><b>'+esc(name(u))+'</b><small>'+esc(handle(u)||"Участник NEXORA")+'</small></span></button>').join(""):'<p class="muted">Пользователи не найдены</p>';document.querySelectorAll("[data-uid]").forEach(b=>{b.disabled=busy;b.onclick=()=>{if(mode==="all")setMode("selected");selected.has(b.dataset.uid)?selected.delete(b.dataset.uid):selected.add(b.dataset.uid);render()}});$("poolCount").textContent=mode==="all"?"В базе: "+users.length:"Выбрано: "+selected.size+" из "+users.length;$("selectVisible").hidden=mode==="all";$("clearSelection").hidden=mode==="all";$("roll").disabled=busy||!pool().length}
function setMode(m){mode=m;$("allMode").classList.toggle("active",m==="all");$("selectedMode").classList.toggle("active",m==="selected");render()}
$("allMode").onclick=()=>setMode("all");$("selectedMode").onclick=()=>setMode("selected");$("search").oninput=render;
$("selectVisible").onclick=()=>{const q=$("search").value.toLowerCase().trim();users.filter(u=>(name(u)+" "+handle(u)).toLowerCase().includes(q)).forEach(u=>selected.add(u.id));render()};
$("clearSelection").onclick=()=>{selected.clear();render()};
function rand(n){if(n<=0)throw Error("Пустой список");const a=new Uint32Array(1),max=4294967296,cutoff=max-max%n;do{crypto.getRandomValues(a)}while(a[0]>=cutoff);return a[0]%n}
function sample(arr,n){const a=arr.slice();for(let i=0;i<n;i++){const j=i+rand(a.length-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function animate(target,source){const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;const seq=Array.from({length:38},()=>source[rand(source.length)]);seq.push(target);const reel=$("reel");reel.style.transition="none";reel.style.transform="translateX(0)";reel.innerHTML=seq.map(u=>'<div class="tile">'+avatar(u)+'<b>'+esc(name(u))+'</b><small class="muted">'+esc(handle(u))+'</small></div>').join("");await new Promise(requestAnimationFrame);const tile=reel.firstElementChild,step=tile.getBoundingClientRect().width+12,offset=$("reel").parentElement.clientWidth/2-tile.getBoundingClientRect().width/2-(seq.length-1)*step;reel.style.transition=reduced?"none":"transform 3200ms cubic-bezier(.12,.78,.1,1)";reel.style.transform="translateX("+offset+"px)";await sleep(reduced?70:3300)}
$("roll").onclick=async()=>{if(busy)return;const p=pool(),n=Number($("count").value);if(!Number.isInteger(n)||n<1||n>10){note("Выбери количество от 1 до 10");return}if(p.length<n){note("Недостаточно участников: доступно "+p.length);return}busy=true;render();$("count").disabled=true;winners=[];$("winners").innerHTML="";$("copy").hidden=true;try{const picked=sample(p,n);for(let i=0;i<picked.length;i++){$("progress").textContent="Открытие "+(i+1)+" из "+n+"…";await animate(picked[i],p);winners.push(picked[i]);$("winners").innerHTML=winners.map((u,j)=>'<div class="winner"><b>№ '+(j+1)+'</b><div class="user">'+avatar(u)+'<span class="who"><strong>'+esc(name(u))+'</strong><small>'+esc(handle(u))+'</small></span></div></div>').join("")}note("Розыгрыш завершён");$("progress").textContent="Победители выбраны случайно, без повторений.";$("copy").hidden=false}catch(e){note("Ошибка розыгрыша: "+e.message)}finally{busy=false;$("count").disabled=false;render()}};
$("copy").onclick=async()=>{const t=winners.map((u,i)=>(i+1)+". "+name(u)+" "+handle(u)).join("\n");try{await navigator.clipboard.writeText(t);note("Результаты скопированы")}catch{note("Не удалось скопировать результаты")}};
onAuthStateChanged(auth,async u=>{if(!u||!u.emailVerified){note("Для загрузки пользователей войди в NEXORA и подтверди почту.");$("users").innerHTML='<p class="muted">Требуется подтверждённый аккаунт</p>';return}try{note("Загружаем пользователей…");const snap=await getDocs(collection(db,"users"));users=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.status!=="banned"&&u.privacy?.discoverable!==false);note("Загружено пользователей: "+users.length);render()}catch(e){console.error(e);note("Не удалось загрузить пользователей: "+(e.code||e.message));$("users").innerHTML='<p class="muted">Проверь правила Firestore и подтверждение почты.</p>'}});
</script></body></html>
