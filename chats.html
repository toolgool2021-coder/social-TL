
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>Сообщения | NEXORA 2.1</title>
<style>
:root{
 color-scheme:dark;
 --bg:#080d19;
 --panel:#141d31ed;
 --line:#ffffff20;
 --text:#edf3ff;
 --muted:#9baac5;
 --blue:#82a9ff
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100dvh;
 font:14px system-ui,sans-serif;
 color:var(--text);
 background:
 radial-gradient(ellipse at 15% 5%,#315b9b40,transparent 55%),
 radial-gradient(ellipse at 90% 90%,#6743ac30,transparent 55%),
 var(--bg)
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
a{color:#b3c9ff;text-decoration:none}
header{
 height:64px;
 padding:0 max(16px,calc((100vw - 1180px)/2));
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:#0c1424ee;
 border-bottom:1px solid var(--line)
}
.brand{font-size:19px;font-weight:900;letter-spacing:.4px}
.brand span{font-size:10px;color:var(--blue)}
#layout{
 max-width:1180px;
 height:calc(100dvh - 88px);
 min-height:380px;
 margin:12px auto;
 padding:0 12px;
 display:grid;
 grid-template-columns:310px minmax(0,1fr);
 gap:12px
}
.glass{
 display:flex;
 flex-direction:column;
 min-width:0;
 min-height:0;
 overflow:hidden;
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:19px;
 backdrop-filter:blur(20px);
 box-shadow:0 15px 40px #0003
}
.head{padding:17px;border-bottom:1px solid var(--line)}
.head h2{margin:0 0 14px}
input{
 width:100%;
 min-width:0;
 padding:12px 14px;
 color:white;
 background:#0b1424;
 border:1px solid #394861;
 border-radius:12px;
 outline:none
}
input:focus{border-color:var(--blue)}
.scroll{overflow:auto;flex:1;min-height:0}
.person{
 width:100%;
 display:flex;
 gap:11px;
 align-items:center;
 padding:13px;
 color:var(--text);
 background:transparent;
 border:0;
 border-bottom:1px solid var(--line);
 text-align:left
}
.person:hover,.person.active{background:#34466b80}
.avatar{
 width:43px;
 height:43px;
 flex-shrink:0;
 display:grid;
 place-items:center;
 overflow:hidden;
 border-radius:14px;
 background:linear-gradient(135deg,#527cda,#a073d7);
 font-weight:800
}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0;flex:1}
.person-name{font-weight:750}
.person-name img{width:18px;height:18px;vertical-align:middle}
.preview{
 margin-top:5px;
 color:var(--muted);
 font-size:12px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis
}
.muted{font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);line-height:1.6}
.chathead{
 display:flex;
 align-items:center;
 gap:12px;
 padding:14px;
 min-height:74px;
 border-bottom:1px solid var(--line)
}
#peerInfo{min-width:0;flex:1}
#peer{font-size:16px;font-weight:800}
#peerStatus{margin-top:5px}
.online{color:#78e6b0}
.typing{color:#9db5ff}
#messages{
 padding:12px 0;
 display:flex;
 flex-direction:column
}
.bubble{
 width:max-content;
 max-width:min(75%,470px);
 margin:5px 14px;
 padding:11px 14px;
 border:1px solid #ffffff12;
 border-radius:17px 17px 17px 5px;
 background:#293a59;
 overflow-wrap:anywhere;
 white-space:pre-wrap;
 animation:rise .2s ease
}
.bubble.mine{
 margin-left:auto;
 border-radius:17px 17px 5px 17px;
 background:linear-gradient(135deg,#465fc0,#705cb6)
}
.bubble small{
 display:block;
 margin-top:7px;
 text-align:right;
 opacity:.75;
 font-size:10px
}
.bubble.sticker{
 padding:5px;
 border:0;
 background:transparent
}
.sticker img{
 width:150px;
 height:150px;
 max-width:100%;
 object-fit:contain
}
.compose-wrap{
 position:relative;
 border-top:1px solid var(--line)
}
#form{
 display:flex;
 align-items:center;
 gap:8px;
 padding:12px
}
#message{flex:1}
.action,.primary{
 padding:11px 14px;
 border-radius:12px;
 color:#eaf1ff;
 border:1px solid #40506d;
 background:#20304c
}
.primary{
 border:0;
 background:linear-gradient(120deg,#4779eb,#8b74ef);
 font-weight:750
}
#stickerPanel{
 position:absolute;
 bottom:calc(100% + 5px);
 left:10px;
 z-index:5;
 width:min(360px,calc(100vw - 40px));
 max-height:340px;
 display:flex;
 flex-direction:column;
 overflow:hidden;
 border:1px solid #526487;
 border-radius:15px;
 background:#17243c;
 box-shadow:0 15px 45px #0009
}
[hidden]{display:none!important}
.sticker-head{
 display:flex;
 gap:8px;
 padding:12px;
 border-bottom:1px solid var(--line)
}
.sticker-head select{
 flex:1;
 min-width:0;
 color:white;
 background:#0b1424;
 border:1px solid #394861;
 border-radius:9px;
 padding:8px
}
#stickerGrid{
 overflow:auto;
 padding:10px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px
}
#stickerGrid button{
 padding:5px;
 background:#ffffff09;
 border:1px solid transparent;
 border-radius:10px
}
#stickerGrid button:hover{border-color:var(--blue)}
#stickerGrid img{width:100%;aspect-ratio:1;object-fit:contain}
#error{
 padding:12px;
 color:#ffb9c0;
 background:#7a273035;
 font-size:12px
}
#back{display:none}
@keyframes rise{
 from{opacity:0;transform:translateY(6px)}
 to{opacity:1;transform:translateY(0)}
}
@media(max-width:650px){
 header{padding:0 14px}
 #layout{
  display:block;
  height:calc(100dvh - 78px);
  margin:7px auto;
  padding:0 7px
 }
 .glass{height:100%}
 #layout:not(.open) #conversation,
 #layout.open #sidebar{display:none}
 #back{display:block}
 .bubble{max-width:85%}
}
@media(prefers-reduced-motion:reduce){
 .bubble{animation:none}
}
</style>
</head>
<body>

<header>
 <div class="brand">NEXORA <span>2.1</span></div>
 <a href="./index.html">← Главная</a>
</header>

<main id="layout">
 <section id="sidebar" class="glass">
  <div class="head">
   <h2>Сообщения</h2>
   <input id="search" placeholder="Поиск пользователей">
  </div>
  <div id="people" class="scroll"></div>
  <div class="head"><b>Мои диалоги</b></div>
  <div id="chats" class="scroll"></div>
 </section>

 <section id="conversation" class="glass">
  <div class="chathead">
   <button id="back" class="action">←</button>
   <div id="peerAvatar" class="avatar">N</div>
   <div id="peerInfo">
    <div id="peer">Выбери собеседника</div>
    <div id="peerStatus" class="muted">
     Сообщения доступны участникам диалога
    </div>
   </div>
  </div>

  <div id="error" hidden></div>

  <div id="messages" class="scroll">
   <div class="empty">Выбери диалог для общения</div>
  </div>

  <div class="compose-wrap">
   <div id="stickerPanel" hidden>
    <div class="sticker-head">
     <select id="stickerPack"></select>
     <button id="closeStickers" class="action">✕</button>
    </div>
    <div id="stickerGrid"></div>
   </div>

   <form id="form">
    <button type="button" id="stickers"
      class="action" disabled>☺</button>
    <input id="message" maxlength="2000"
      placeholder="Сообщение..." disabled>
    <button id="send" class="primary" disabled>➤</button>
   </form>
  </div>
 </section>
</main>

<script type="module">
import {initializeApp} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {
 getFirestore,collection,doc,getDoc,getDocs,
 query,where,limit,orderBy,onSnapshot,
 writeBatch,serverTimestamp,setDoc
} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const cfg={
 apiKey:'AIzaSyD9prfvOQGMeniL3U8WD2HeeZ6NNArY8J8',
 authDomain:'toolchat-bfac8.firebaseapp.com',
 projectId:'toolchat-bfac8',
 storageBucket:'toolchat-bfac8.firebasestorage.app',
 messagingSenderId:'52396840735',
 appId:'1:52396840735:web:a608b9c037c8481f2dc22a'
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let me=null;
let users={};
let activeUid=null;
let stopMessages=null;
let stopChats=null;
let stopPresence=null;
let stopTyping=null;
let currentMessages=[];
let typingTimeout=null;
let typingActive=false;
let reading=false;
let chatGeneration=0;
let peerOnline=false;
let peerTyping=false;

const escapeHTML=value=>String(value??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 })[c]
);

function chatId(a,b){
 return [a,b].sort().join('_');
}

function safeImage(url){
 try{
  const parsed=new URL(url);
  return parsed.protocol==='https:'?parsed.href:'';
 }catch{return ''}
}

function avatar(user){
 const url=safeImage(user?.avatarUrl);
 return url
  ?`<img src="${escapeHTML(url)}" alt="">`
  :escapeHTML((user?.name||'N').slice(0,2).toUpperCase());
}

function badge(user){
 const v=Number(user?.verification||0);
 return v>=1&&v<=5
  ?`<img src="./image/Verified_${v}.png" alt="✓">`
  :'';
}

function personRow(uid,preview=''){
 const user=users[uid]||{};
 return `
  <button class="person" data-user="${escapeHTML(uid)}">
   <span class="avatar">${avatar(user)}</span>
   <span class="person-info">
    <span class="person-name">
     ${escapeHTML(user.name||'Пользователь')}
     ${badge(user)}
    </span>
    <div class="preview">${escapeHTML(preview)}</div>
   </span>
  </button>
 `;
}

function showError(message){
 $('error').hidden=false;
 $('error').textContent=message;
}

function clearError(){
 $('error').hidden=true;
 $('error').textContent='';
}

function searchUsers(){
 if(!me)return;

 const term=$('search').value.toLowerCase().trim();

 if(!term){
  $('people').innerHTML='';
  return;
 }

 const matches=Object.keys(users)
  .filter(uid=>
   uid!==me.uid &&
   (users[uid].name||'').toLowerCase().includes(term)
  )
  .slice(0,30);

 $('people').innerHTML=matches.map(
  uid=>personRow(uid,'Начать диалог')
 ).join('')||'<div class="empty">Ничего не найдено</div>';
}

$('search').oninput=searchUsers;

document.addEventListener('click',event=>{
 const button=event.target.closest('[data-user]');
 if(button)openChat(button.dataset.user);
});

function updatePeerStatus(){
 if(!activeUid)return;

 const element=$('peerStatus');

 if(peerTyping){
  element.textContent='Печатает...';
  element.className='muted typing';
 }else if(peerOnline){
  element.textContent='● Недавно был активен';
  element.className='muted online';
 }else{
  element.textContent='○ Не в сети';
  element.className='muted';
 }
}

function stopActive(){
 stopMessages?.();
 stopPresence?.();
 stopTyping?.();

 stopMessages=null;
 stopPresence=null;
 stopTyping=null;

 clearTimeout(typingTimeout);
 typingActive=false;
 peerOnline=false;
 peerTyping=false;
 currentMessages=[];
 chatGeneration++;
}

async function openChat(uid){
 if(!me||uid===me.uid)return;

 stopActive();
 activeUid=uid;
 const generation=chatGeneration;

 clearError();

 if(!users[uid]){
  try{
   const snapshot=await getDoc(doc(db,'users',uid));

   if(!snapshot.exists())throw Error('Пользователь не найден');
   if(generation!==chatGeneration)return;

   users[uid]=snapshot.data();
  }catch(error){
   showError(error.message);
   return;
  }
 }

 $('layout').classList.add('open');
 $('peer').textContent=users[uid].name||'Пользователь';
 $('peerAvatar').innerHTML=avatar(users[uid]);
 $('messages').innerHTML=
  '<div class="empty">Загрузка сообщений...</div>';

 $('message').disabled=false;
 $('send').disabled=false;
 $('stickers').disabled=false;

 const id=chatId(me.uid,uid);

 stopPresence=onSnapshot(
  doc(db,'presence',uid),
  snapshot=>{
   if(generation!==chatGeneration)return;

   const lastSeen=snapshot.data()?.lastSeen?.toMillis?.();

   peerOnline=Boolean(
    lastSeen && Math.abs(Date.now()-lastSeen)<120000
   );

   updatePeerStatus();
  },
  ()=>{}
 );

 // Отсутствующий документ набора не считается ошибкой.
 stopTyping=onSnapshot(
  doc(db,'chats',id,'typing',uid),
  snapshot=>{
   if(generation!==chatGeneration)return;

   const data=snapshot.data();
   const last=data?.updatedAt?.toMillis?.()||0;

   peerTyping=Boolean(
    data?.typing &&
    last &&
    Math.abs(Date.now()-last)<10000
   );

   updatePeerStatus();
  },
  error=>console.warn('Typing:',error.message)
 );

 stopMessages=onSnapshot(
  query(
   collection(db,'chats',id,'messages'),
   orderBy('createdAt','asc'),
   limit(200)
  ),
  snapshot=>{
   if(generation!==chatGeneration)return;

   currentMessages=snapshot.docs.map(item=>({
    id:item.id,
    ...item.data()
   }));

   renderMessages();
   markRead(id,uid);
  },
  error=>showError(
   'Не удалось загрузить переписку: '+error.message
  )
 );
}

function stickerSource(key){
 if(typeof key!=='string')return '';

 const parts=key.split('/');
 if(parts.length!==2)return '';

 const pack=STICKER_PACKS.find(p=>p.id===parts[0]);

 if(!pack||!pack.files.includes(parts[1])){
  return '';
 }

 return './image/stic/'+parts[0]+'/'+parts[1];
}

function renderMessages(){
 const box=$('messages');

 box.innerHTML=currentMessages.map(message=>{
  const mine=message.senderId===me.uid;

  const time=message.createdAt?.toDate?.()
   .toLocaleTimeString('ru-RU',{
    hour:'2-digit',
    minute:'2-digit'
   })||'';

  const isSticker=message.type==='sticker';
  const src=isSticker?stickerSource(message.sticker):'';

  const content=isSticker
   ?src
    ?`<img src="${escapeHTML(src)}" alt="Стикер">`
    :'<span>Стикер недоступен</span>'
   :escapeHTML(message.text||'');

  const status=mine
   ?message.readAt?' · Прочитано':' · Отправлено'
   :'';

  return `
   <div class="bubble
    ${mine?'mine':''}
    ${isSticker?'sticker':''}">
    ${content}
    <small>${escapeHTML(time+status)}</small>
   </div>
  `;
 }).join('')||
 '<div class="empty">Сообщений пока нет</div>';

 box.scrollTop=box.scrollHeight;
}

async function markRead(id,peerUid){
 if(reading||!me||activeUid!==peerUid)return;

 const unread=currentMessages.filter(message=>
  message.senderId===peerUid&&!message.readAt
 );

 if(!unread.length)return;

 reading=true;

 try{
  // Не более 200 сообщений за один пакет.
  const batch=writeBatch(db);

  unread.forEach(message=>{
   batch.update(
    doc(db,'chats',id,'messages',message.id),
    {readAt:serverTimestamp()}
   );
  });

  await batch.commit();
 }catch(error){
  console.warn('Read receipts:',error.message);
 }finally{
  reading=false;
 }
}

async function ensureChat(uid){
 const id=chatId(me.uid,uid);
 const ref=doc(db,'chats',id);
 const snapshot=await getDoc(ref);

 if(!snapshot.exists()){
  await setDoc(ref,{
   participants:[me.uid,uid].sort(),
   updatedAt:serverTimestamp(),
   lastText:''
  });
 }

 return id;
}

async function sendMessage(payload){
 if(!me||!activeUid)return;

 const uid=activeUid;
 const id=await ensureChat(uid);

 if(activeUid!==uid)return;

 const batch=writeBatch(db);

 const preview=payload.type==='sticker'
  ?'Стикер'
  :payload.text.slice(0,100);

 batch.set(
  doc(db,'chats',id),
  {
   participants:[me.uid,uid].sort(),
   updatedAt:serverTimestamp(),
   lastText:preview
  },
  {merge:true}
 );

 batch.set(
  doc(collection(db,'chats',id,'messages')),
  {
   senderId:me.uid,
   type:payload.type||'text',
   text:payload.text||'',
   sticker:payload.sticker||'',
   createdAt:serverTimestamp()
  }
 );

 await batch.commit();
}

$('form').onsubmit=async event=>{
 event.preventDefault();

 const text=$('message').value.trim();
 if(!text||text.length>2000)return;

 $('send').disabled=true;

 try{
  await sendMessage({type:'text',text});
  $('message').value='';
  await setTyping(false);
 }catch(error){
  showError('Ошибка отправки: '+error.message);
 }finally{
  $('send').disabled=false;
 }
};

async function setTyping(value){
 if(!me||!activeUid)return;
 if(typingActive===value)return;

 const uid=activeUid;
 typingActive=value;

 try{
  const id=await ensureChat(uid);

  if(activeUid!==uid)return;

  await setDoc(
   doc(db,'chats',id,'typing',me.uid),
   {
    uid:me.uid,
    typing:value,
    updatedAt:serverTimestamp()
   }
  );
 }catch(error){
  typingActive=false;
  console.warn('Typing:',error.message);
 }
}

$('message').addEventListener('input',()=>{
 if(!activeUid)return;

 setTyping(Boolean($('message').value.trim()));

 clearTimeout(typingTimeout);

 typingTimeout=setTimeout(()=>{
  setTyping(false);
 },2500);
});

$('back').onclick=()=>{
 $('layout').classList.remove('open');
 $('stickerPanel').hidden=true;
};

// Список файлов должен совпадать с файлами в репозитории.
// Пока реальных файлов нет, список оставлен пустым.
const STICKER_PACKS=[
 {
  id:'kemomimiori',
  title:'Kemomimiori',
  files:[]
 }
];

function renderStickerPacks(){
 $('stickerPack').innerHTML=STICKER_PACKS.map(pack=>`
  <option value="${escapeHTML(pack.id)}">
   ${escapeHTML(pack.title)}
  </option>
 `).join('');

 renderStickers();
}

function renderStickers(){
 const pack=STICKER_PACKS.find(
  p=>p.id===$('stickerPack').value
 );

 if(!pack||!pack.files.length){
  $('stickerGrid').innerHTML=
   '<p class="muted">Стикеры пока не загружены</p>';
  return;
 }

 $('stickerGrid').innerHTML=pack.files.map(file=>{
  const key=pack.id+'/'+file;
  const src=stickerSource(key);

  return `
   <button type="button" data-sticker="${escapeHTML(key)}">
    <img src="${escapeHTML(src)}"
     alt="Стикер" loading="lazy">
   </button>
  `;
 }).join('');
}

$('stickerPack').onchange=renderStickers;

$('stickers').onclick=()=>{
 $('stickerPanel').hidden=!$('stickerPanel').hidden;
};

$('closeStickers').onclick=()=>{
 $('stickerPanel').hidden=true;
};

$('stickerGrid').addEventListener('click',async event=>{
 const button=event.target.closest('[data-sticker]');
 if(!button||!activeUid)return;

 button.disabled=true;

 try{
  await sendMessage({
   type:'sticker',
   sticker:button.dataset.sticker
  });

  $('stickerPanel').hidden=true;
 }catch(error){
  showError('Ошибка стикера: '+error.message);
 }finally{
  button.disabled=false;
 }
});

renderStickerPacks();

onAuthStateChanged(auth,async user=>{
 stopChats?.();
 stopChats=null;

 stopActive();
 activeUid=null;
 me=user;

 if(!user){
  $('layout').innerHTML=`
   <section class="glass" style="padding:25px">
    <h2>Требуется вход</h2>
    <p>Авторизуйся для просмотра сообщений.</p>
    <a href="./index.html">На главную</a>
   </section>
  `;
  return;
 }

 try{
  const snapshot=await getDocs(query(
   collection(db,'users'),
   limit(200)
  ));

  if(auth.currentUser?.uid!==user.uid)return;

  users={};

  snapshot.forEach(item=>{
   users[item.id]=item.data();
  });

  searchUsers();

  const requested=new URLSearchParams(
   location.search
  ).get('user');

  if(requested&&requested!==user.uid){
   await openChat(requested);
  }

  stopChats=onSnapshot(
   query(
    collection(db,'chats'),
    where('participants','array-contains',user.uid),
    limit(100)
   ),
   snapshot=>{
    const records=snapshot.docs.sort((a,b)=>
     (b.data().updatedAt?.seconds||0)-
     (a.data().updatedAt?.seconds||0)
    );

    $('chats').innerHTML=records.map(item=>{
     const data=item.data();

     const other=data.participants?.find(
      uid=>uid!==user.uid
     );

     return other
      ?personRow(other,data.lastText||'Диалог')
      :'';
    }).join('')||
    '<div class="empty">Диалогов пока нет</div>';
   },
   error=>showError(
    'Ошибка списка диалогов: '+error.message
   )
  );
 }catch(error){
  showError('Ошибка загрузки: '+error.message);
 }
});
</script>
</body>
</html>
