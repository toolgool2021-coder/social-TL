
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d17">
<title>NEXORA | Сообщения</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090d17;
  --surface:#131a2a;
  --surface2:#1c2639;
  --stroke:#ffffff14;
  --text:#f2f5ff;
  --muted:#8c9ab4;
  --accent:#8a9cff;
  --mint:#71dfba;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 5% 5%,#2537665c,transparent 55%),
    radial-gradient(ellipse at 100% 100%,#49325c3b,transparent 55%),
    var(--bg);
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
.app{
  max-width:1500px;
  height:100dvh;
  margin:auto;
  padding:16px;
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
  gap:14px;
}
.panel{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:linear-gradient(145deg,#182134ee,#101725f2);
  border:1px solid var(--stroke);
  border-radius:24px;
  box-shadow:0 18px 65px #0005;
  backdrop-filter:blur(22px);
}
.sidebar-top{padding:22px 18px 15px}
.logo{
  font-size:17px;
  font-weight:850;
  letter-spacing:.16em;
}
.logo-mark{
  display:inline-grid;
  place-items:center;
  width:30px;height:30px;
  margin-right:8px;
  border-radius:10px;
  background:linear-gradient(135deg,#8999ff,#bd88d5);
  color:#0d1220;
  font-weight:900;
}
.sidebar-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:28px 0 13px;
}
.sidebar-title h1{font-size:23px;margin:0}
.hint{color:var(--muted);font-size:12px}
.search-wrap{position:relative}
.search-wrap span{
  position:absolute;
  left:14px;top:11px;
  color:var(--muted);
}
input[type=search]{
  width:100%;
  border:1px solid var(--stroke);
  border-radius:13px;
  padding:12px 12px 12px 42px;
  background:#0b1220b8;
  color:var(--text);
  outline:none;
}
input::placeholder,textarea::placeholder{color:#74829b}
.section-label{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8491ab;
  font-weight:800;
  padding:17px 20px 9px;
}
.scroll{
  overflow:auto;
  min-height:0;
  scrollbar-color:#44506b transparent;
  scrollbar-width:thin;
}
.people-list{max-height:33%;flex-shrink:0}
.chats-list{flex:1}
.person{
  display:flex;
  width:calc(100% - 16px);
  margin:3px 8px;
  padding:12px;
  align-items:center;
  gap:12px;
  border:1px solid transparent;
  border-radius:15px;
  background:transparent;
  color:inherit;
  text-align:left;
  transition:background .18s,border .18s;
}
.person:hover{background:#ffffff0a}
.person.active{
  background:linear-gradient(100deg,#6676bc35,#6c52951b);
  border-color:#8d9dfb2a;
}
.avatar{
  display:grid;
  place-items:center;
  width:47px;height:47px;
  flex-shrink:0;
  border-radius:17px;
  background:linear-gradient(145deg,#6c7fc5,#8462a7);
  font-weight:800;
  font-size:16px;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{flex:1;min-width:0}
.person-name{
  display:flex;
  align-items:center;
  gap:5px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
}
.person-name span{
  overflow:hidden;
  text-overflow:ellipsis;
}
.preview{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  margin-top:3px;
}
.verified-icon{
  width:17px;height:17px;
  object-fit:contain;
  flex-shrink:0;
}
.side-bottom{
  padding:14px 18px;
  border-top:1px solid var(--stroke);
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
}
.side-bottom a{color:#b4c2ff}
.chat-header{
  height:82px;
  padding:14px 22px;
  display:flex;
  align-items:center;
  gap:13px;
  border-bottom:1px solid var(--stroke);
  flex-shrink:0;
}
.chat-header .avatar{width:46px;height:46px}
.peer-details{flex:1;min-width:0}
.peer-name{
  font-size:16px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:6px;
}
.status{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}
.status.online{color:var(--mint)}
.status.typing{color:#a6afff}
.icon-btn{
  border:0;
  background:transparent;
  color:#9eacc7;
  display:grid;
  place-items:center;
  width:38px;height:38px;
  border-radius:12px;
  flex-shrink:0;
  font-size:20px;
}
.icon-btn:hover{background:#ffffff12;color:white}
.pin{
  margin:12px 18px 0;
  padding:10px 12px;
  border:1px solid #8d9dfb30;
  background:#7b8cfa13;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
}
.pin-content{flex:1;min-width:0}
.pin-content b{font-size:12px;color:#b7c3ff}
.pin-content p{
  margin:2px 0 0;
  color:#c7d1e6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
}
.message-search{padding:10px 20px 0}
.message-search input{
  width:100%;
  padding:10px 14px;
  border-radius:11px;
  border:1px solid #ffffff17;
  background:#0c1321;
  color:white;
}
.messages{
  flex:1;
  padding:22px 28px;
  overflow:auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:9px;
  overscroll-behavior:contain;
}
.day-divider{
  display:flex;
  align-items:center;
  gap:15px;
  color:#8d9bb5;
  font-size:11px;
  align-self:stretch;
  margin:15px 0;
}
.day-divider:before,.day-divider:after{
  content:"";
  height:1px;
  flex:1;
  background:#ffffff12;
}
.message-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
  max-width:100%;
}
.message-row.mine{justify-content:flex-end}
.bubble{
  max-width:min(76%,560px);
  min-width:90px;
  padding:11px 13px 8px;
  border:1px solid #ffffff0d;
  border-radius:17px 17px 17px 5px;
  background:#253149;
  box-shadow:0 5px 17px #00000017;
  overflow-wrap:anywhere;
  animation:appear .16s ease;
}
.mine .bubble{
  background:linear-gradient(130deg,#485fa3,#61589e);
  border-radius:17px 17px 5px 17px;
}
.bubble.sticker{
  background:transparent;
  box-shadow:none;
  border:0;
}
.bubble.sticker img{
  width:148px;height:148px;
  object-fit:contain;
}
.msg-text{white-space:pre-wrap;line-height:1.55}
.msg-meta{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:5px;
  color:#d6ddf0b0;
  font-size:10px;
}
.reply-quote{
  border-left:3px solid #a7b8ff;
  padding:5px 9px;
  background:#ffffff12;
  border-radius:5px;
  margin-bottom:9px;
  color:#e2e8ff;
  font-size:12px;
}
.reaction-line{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}
.reaction{
  border:1px solid #ffffff23;
  border-radius:20px;
  background:#ffffff12;
  color:white;
  padding:3px 9px;
  font-size:12px;
}
.reaction.selected{
  border-color:#c2ccff;
  background:#9bafff42;
}
.msg-more{
  width:30px;height:30px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#8d9bb5;
  opacity:0;
  transition:opacity .15s;
}
.message-row:hover .msg-more,
.msg-more:focus-visible{opacity:1}
.empty{
  margin:auto;
  text-align:center;
  max-width:300px;
  color:var(--muted);
  line-height:1.7;
}
.empty-symbol{
  width:72px;height:72px;
  border-radius:24px;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  background:linear-gradient(140deg,#7182d936,#9c71d52c);
  color:#b6c1ff;
  font-size:30px;
}
.empty h2{color:var(--text);margin:0 0 7px;font-size:19px}
.composer-area{
  padding:10px 19px 17px;
  position:relative;
  border-top:1px solid var(--stroke);
  background:#121a2b99;
}
.reply-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 13px;
  margin-bottom:10px;
  background:#7585cb1a;
  border-radius:12px;
  color:#bdc9ff;
  font-size:12px;
}
.reply-bar span{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:7px;
  border:1px solid #ffffff19;
  border-radius:18px;
  background:#0b1220e6;
}
.composer:focus-within{border-color:#8b9cff66}
.composer textarea{
  flex:1;
  min-width:0;
  resize:none;
  max-height:145px;
  min-height:40px;
  line-height:1.45;
  padding:11px 3px;
  background:transparent;
  color:white;
  border:0;
  outline:none;
}
.send-btn{
  display:grid;
  place-items:center;
  flex-shrink:0;
  width:42px;height:42px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#7187ff,#9d7fe7);
  color:white;
  font-size:20px;
  box-shadow:0 5px 22px #7885f43b;
}
.composer-caption{
  text-align:center;
  color:#65738d;
  font-size:10px;
  margin-top:8px;
}
.popup{
  position:fixed;
  z-index:20;
  background:#1b263c;
  border:1px solid #ffffff25;
  border-radius:15px;
  box-shadow:0 18px 45px #0009;
}
.menu{width:204px;padding:6px}
.menu button{
  display:block;
  width:100%;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#edf2ff;
  padding:10px;
  text-align:left;
}
.menu button:hover{background:#ffffff15}
.menu .danger{color:#ff9eaa}
.emoji-picker{display:flex;gap:4px;padding:9px}
.emoji-picker button{
  font-size:22px;
  border:0;
  border-radius:10px;
  background:transparent;
  padding:6px;
}
.emoji-picker button:hover{background:#ffffff1b}
.sticker-panel{
  position:absolute;
  bottom:100%;
  left:20px;
  width:min(350px,calc(100% - 40px));
  max-height:350px;
  padding:12px;
}
.sticker-panel select{
  width:100%;
  padding:9px;
  background:#11192a;
  color:white;
  border:1px solid #ffffff20;
  border-radius:9px;
}
.sticker-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  overflow:auto;
  max-height:270px;
  margin-top:10px;
}
.sticker-grid button{
  background:#ffffff0a;
  border:0;
  border-radius:10px;
  padding:4px;
}
.sticker-grid img{
  width:100%;
  aspect-ratio:1;
  object-fit:contain;
}
.notice{
  margin:9px 18px;
  padding:10px 13px;
  background:#74323e55;
  border:1px solid #f1a0ad35;
  border-radius:10px;
  color:#ffbdc8;
  font-size:12px;
}
.overlay{
  position:fixed;
  inset:0;
  background:#050811ba;
  display:grid;
  place-items:center;
  z-index:30;
  padding:18px;
  backdrop-filter:blur(8px);
}
.dialog{
  width:min(450px,100%);
  padding:24px;
  background:#1a2539;
  border:1px solid #ffffff22;
  border-radius:20px;
}
.dialog h2{font-size:19px;margin:0 0 15px}
.dialog textarea{
  width:100%;
  min-height:115px;
  resize:vertical;
  border:1px solid #ffffff22;
  border-radius:12px;
  background:#0e1728;
  color:white;
  padding:13px;
}
.dialog-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:16px;
}
.btn{
  border:1px solid #ffffff23;
  background:#26354d;
  border-radius:11px;
  color:white;
  padding:10px 16px;
}
.btn.primary{background:#7789e8;border:0}
.back{display:none}
@keyframes appear{
  from{opacity:.4;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:720px){
  .app{display:block;padding:0}
  .panel{height:100dvh;border-radius:0;border:0}
  .app:not(.open) #conversation{display:none}
  .app.open #sidebar{display:none}
  .back{display:grid}
  .messages{padding:15px 12px}
  .bubble{max-width:83%}
  .msg-more{opacity:1}
  .chat-header{padding:12px;height:72px}
  .composer-area{padding:9px 10px 12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>
<body>

<main class="app" id="app">
  <aside class="panel" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        <span class="logo-mark">N</span>NEXORA
      </div>
      <div class="sidebar-title">
        <h1>Сообщения</h1>
        <span class="hint">Личное пространство</span>
      </div>
      <div class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search"
          placeholder="Найти пользователя">
      </div>
    </div>
    <div id="people" class="scroll people-list"></div>
    <div class="section-label">Диалоги</div>
    <div id="chats" class="scroll chats-list">
      <div class="empty">Загрузка...</div>
    </div>
    <div class="side-bottom">
      <span>✦ NEXORA</span>
      <a href="./index.html">Главная ↗</a>
    </div>
  </aside>

  <section class="panel" id="conversation">
    <div class="chat-header">
      <button class="icon-btn back" id="back">‹</button>
      <div class="avatar" id="peerAvatar">N</div>
      <div class="peer-details">
        <div class="peer-name" id="peer">
          Выбери диалог
        </div>
        <div class="status" id="peerStatus">
          Личные сообщения
        </div>
      </div>
      <button class="icon-btn" id="toggleSearch"
        title="Поиск по сообщениям">⌕</button>
    </div>

    <div id="error" class="notice" hidden></div>

    <div class="pin" id="pinned" hidden>
      <span>📌</span>
      <div class="pin-content">
        <b>Закреплённое сообщение</b>
        <p id="pinnedText"></p>
      </div>
      <button class="icon-btn" id="unpin">×</button>
    </div>

    <div class="message-search" id="messageSearchWrap" hidden>
      <input id="chatSearch" type="search"
        placeholder="Поиск в переписке">
    </div>

    <div class="messages" id="messages">
      <div class="empty">
        <div class="empty-symbol">✦</div>
        <h2>Твои сообщения</h2>
        Выбери диалог, чтобы начать общение.
      </div>
    </div>

    <div class="composer-area">
      <div class="reply-bar" id="replyBar" hidden>
        <span id="replyText"></span>
        <button class="icon-btn" id="cancelReply">×</button>
      </div>

      <div class="popup sticker-panel" id="stickerPanel" hidden>
        <select id="stickerPack"></select>
        <div id="stickerGrid" class="sticker-grid"></div>
      </div>

      <form class="composer" id="form">
        <button class="icon-btn" id="stickers"
          type="button" disabled>☺</button>
        <textarea id="message" rows="1"
          maxlength="2000"
          placeholder="Написать сообщение..."
          disabled></textarea>
        <button class="send-btn" id="send"
          type="submit" disabled>➤</button>
      </form>
      <div class="composer-caption">
        NEXORA · Твоё пространство для общения
      </div>
    </div>
  </section>
</main>

<div class="popup menu" id="contextMenu" hidden></div>
<div class="popup emoji-picker" id="emojiPicker" hidden></div>

<div class="overlay" id="editOverlay" hidden>
  <div class="dialog">
    <h2>Редактировать сообщение</h2>
    <textarea id="editText" maxlength="2000"></textarea>
    <div class="dialog-actions">
      <button class="btn" id="editCancel">Отмена</button>
      <button class="btn primary" id="editSave">
        Сохранить
      </button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {getAuth,onAuthStateChanged} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,collection,doc,getDoc,getDocs,
  query,where,limit,orderBy,onSnapshot,
  writeBatch,serverTimestamp,setDoc,updateDoc,
  deleteDoc,runTransaction,FieldPath
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyD9prfvOQGMeniL3U8WD2HeeZ6NNArY8J8",
  authDomain:"toolchat-bfac8.firebaseapp.com",
  projectId:"toolchat-bfac8",
  storageBucket:"toolchat-bfac8.firebasestorage.app",
  messagingSenderId:"52396840735",
  appId:"1:52396840735:web:a608b9c037c8481f2dc22a"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let me=null;
let users={};
let activeUid=null;
let chatRecords=[];
let currentMessages=[];
let stopChats=null;
let stopMessages=null;
let stopPresence=null;
let stopTyping=null;
let stopPin=null;
let generation=0;
let replyTo=null;
let editingId=null;
let contextId=null;
let pinnedId=null;
let peerOnline=false;
let peerTyping=false;
let typingActive=false;
let typingTimer=null;
let reading=false;
let sending=false;

const EMOJIS=["❤️","👍","😂","😮","😢","🔥"];

const STICKER_PACKS=[
  {id:"kemomimiori",title:"Kemomimiori",files:[]}
];

const esc=value=>String(value??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]
);

function chatId(a,b){
  return [a,b].sort().join("_");
}

function activeChat(){
  return me&&activeUid
    ?chatId(me.uid,activeUid)
    :null;
}

function safeImage(value){
  try{
    const u=new URL(value);
    return u.protocol==="https:"?u.href:"";
  }catch{
    return "";
  }
}

function avatar(user){
  const url=safeImage(user?.avatarUrl);
  return url
    ?`<img src="${esc(url)}" alt=""
       referrerpolicy="no-referrer">`
    :esc((user?.name||"N").slice(0,2).toUpperCase());
}

function badge(user){
  const v=Number(user?.verification||0);
  if(v<1||v>5)return "";
  return `<img class="verified-icon"
    src="./image/Verified_${v}.png"
    alt="Верификация">`;
}

function error(message){
  $("error").hidden=false;
  $("error").textContent=message;
}

function clearError(){
  $("error").hidden=true;
}

function personRow(uid,preview=""){
  const user=users[uid]||{};
  return `
    <button class="person ${uid===activeUid?"active":""}"
      data-user="${esc(uid)}">
      <span class="avatar">${avatar(user)}</span>
      <span class="person-info">
        <span class="person-name">
          <span>${esc(user.name||"Пользователь")}</span>
          ${badge(user)}
        </span>
        <div class="preview">${esc(preview)}</div>
      </span>
    </button>`;
}

function searchUsers(){
  if(!me)return;
  const term=$("search").value.toLowerCase().trim();

  if(!term){
    $("people").innerHTML="";
    return;
  }

  const ids=Object.keys(users).filter(uid=>
    uid!==me.uid &&
    String(users[uid].name||"")
      .toLowerCase().includes(term)
  ).slice(0,30);

  $("people").innerHTML=ids.map(uid=>
    personRow(uid,"Начать диалог")
  ).join("")||'<div class="empty">Не найдено</div>';
}

$("search").oninput=searchUsers;

document.addEventListener("click",event=>{
  const button=event.target.closest("[data-user]");
  if(button)openChat(button.dataset.user);

  if(!event.target.closest("#contextMenu") &&
     !event.target.closest("[data-menu]") &&
     !event.target.closest("#emojiPicker")){
    hideMenus();
  }
});

function renderChats(){
  if(!me)return;

  $("chats").innerHTML=chatRecords.map(item=>{
    const data=item.data();
    const other=data.participants?.find(
      uid=>uid!==me.uid
    );
    return other
      ?personRow(other,data.lastText||"Диалог")
      :"";
  }).join("")||'<div class="empty">Диалогов пока нет</div>';
}

function updateStatus(){
  const element=$("peerStatus");
  element.className="status";

  if(peerTyping){
    element.textContent="Печатает...";
    element.classList.add("typing");
  }else if(peerOnline){
    element.textContent="● Недавно был активен";
    element.classList.add("online");
  }else{
    element.textContent="Не в сети";
  }
}

function clearReply(){
  replyTo=null;
  $("replyBar").hidden=true;
}

function hideMenus(){
  $("contextMenu").hidden=true;
  $("emojiPicker").hidden=true;
}

function stopActive(){
  stopMessages?.();
  stopPresence?.();
  stopTyping?.();
  stopPin?.();

  stopMessages=null;
  stopPresence=null;
  stopTyping=null;
  stopPin=null;

  clearTimeout(typingTimer);
  generation++;
  currentMessages=[];
  replyTo=null;
  editingId=null;
  pinnedId=null;
  peerOnline=false;
  peerTyping=false;
  typingActive=false;

  clearReply();
  hideMenus();
  $("pinned").hidden=true;
  $("messageSearchWrap").hidden=true;
  $("chatSearch").value="";
}

async function openChat(uid){
  if(!me||uid===me.uid)return;

  stopActive();
  activeUid=uid;
  const g=generation;
  clearError();

  $("app").classList.add("open");
  $("messages").innerHTML=
    '<div class="empty">Загрузка сообщений...</div>';

  try{
    if(!users[uid]){
      const snap=await getDoc(doc(db,"users",uid));
      if(!snap.exists())throw Error("Пользователь не найден");
      users[uid]=snap.data();
    }

    if(g!==generation)return;

    const user=users[uid];

    $("peer").innerHTML=
      `<span>${esc(user.name||"Пользователь")}</span>${badge(user)}`;
    $("peerAvatar").innerHTML=avatar(user);

    $("message").disabled=false;
    $("send").disabled=false;
    $("stickers").disabled=false;

    renderChats();
    searchUsers();

    const cid=chatId(me.uid,uid);

    stopPresence=onSnapshot(
      doc(db,"presence",uid),
      snap=>{
        if(g!==generation)return;
        const last=snap.data()?.lastSeen?.toMillis?.()||0;
        peerOnline=last>0&&Date.now()-last<120000;
        updateStatus();
      },
      ()=>{}
    );

    stopTyping=onSnapshot(
      doc(db,"chats",cid,"typing",uid),
      snap=>{
        if(g!==generation)return;
        const data=snap.data();
        const last=data?.updatedAt?.toMillis?.()||0;
        peerTyping=Boolean(
          data?.typing&&last&&Date.now()-last<10000
        );
        updateStatus();
      },
      ()=>{}
    );

    stopPin=onSnapshot(
      doc(db,"chats",cid),
      snap=>{
        if(g!==generation)return;
        pinnedId=snap.data()?.pinnedMessageId||null;
        $("pinnedText").textContent=
          snap.data()?.pinnedText||"Сообщение";
        $("pinned").hidden=!pinnedId;
      },
      ()=>{}
    );

    stopMessages=onSnapshot(
      query(
        collection(db,"chats",cid,"messages"),
        orderBy("createdAt","desc"),
        limit(100)
      ),
      snap=>{
        if(g!==generation)return;
        const previousCount=currentMessages.length;
        currentMessages=snap.docs.map(d=>({
          id:d.id,...d.data()
        })).reverse();

        renderMessages(previousCount===0);
        markRead(cid,uid);
      },
      err=>error("Сообщения: "+err.message)
    );
  }catch(err){
    if(g===generation)error(err.message);
  }
}

function stickerSource(key){
  if(typeof key!=="string")return "";
  const [packId,file]=key.split("/");
  const pack=STICKER_PACKS.find(p=>p.id===packId);
  if(!pack||!pack.files.includes(file))return "";
  return `./image/stic/${packId}/${file}`;
}

function renderMessages(forceBottom=false){
  const box=$("messages");
  const oldTop=box.scrollTop;
  const nearBottom=
    box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const term=$("chatSearch").value.toLowerCase().trim();

  const messages=term
    ?currentMessages.filter(m=>
        String(m.text||"").toLowerCase().includes(term)
      )
    :currentMessages;

  let html="";
  let lastDay="";

  for(const m of messages){
    const date=m.createdAt?.toDate?.();
    const day=date?date.toLocaleDateString("ru-RU"):"";
    const time=date?date.toLocaleTimeString("ru-RU",{
      hour:"2-digit",minute:"2-digit"
    }):"";

    if(day&&day!==lastDay){
      html+=`<div class="day-divider">${esc(day)}</div>`;
      lastDay=day;
    }

    const mine=m.senderId===me.uid;
    const sticker=m.type==="sticker";
    const src=sticker?stickerSource(m.sticker):"";

    const reactions=m.reactions||{};
    const reactionHtml=EMOJIS.map(emoji=>{
      const ids=Array.isArray(reactions[emoji])
        ?reactions[emoji]:[];
      if(!ids.length)return "";
      return `<button class="reaction
        ${ids.includes(me.uid)?"selected":""}"
        data-react="${esc(emoji)}"
        data-id="${esc(m.id)}">
        ${emoji} ${ids.length}
      </button>`;
    }).join("");

    html+=`
      <div class="message-row ${mine?"mine":""}"
        data-message="${esc(m.id)}">

        ${mine?`
          <button class="msg-more"
            data-menu="${esc(m.id)}">⋯</button>
        `:""}

        <div class="bubble ${sticker?"sticker":""}">
          ${m.replyText?`
            <div class="reply-quote">
              ↩ ${esc(m.replyText)}
            </div>`:""}

          ${sticker
            ?src
              ?`<img src="${esc(src)}" alt="Стикер">`
              :'<span>Стикер недоступен</span>'
            :`<div class="msg-text">${esc(m.text||"")}</div>`
          }

          <div class="msg-meta">
            ${m.editedAt?"изменено · ":""}
            ${esc(time)}
            ${mine?(m.readAt?"✓✓":"✓"):""}
          </div>

          ${reactionHtml?`
            <div class="reaction-line">
              ${reactionHtml}
            </div>`:""}
        </div>

        ${!mine?`
          <button class="msg-more"
            data-menu="${esc(m.id)}">⋯</button>
        `:""}
      </div>`;
  }

  box.innerHTML=html||`
    <div class="empty">
      <div class="empty-symbol">✦</div>
      <h2>Пока пусто</h2>
      Напиши первое сообщение.
    </div>`;

  if(!term&&(forceBottom||nearBottom)){
    box.scrollTop=box.scrollHeight;
  }else{
    box.scrollTop=oldTop;
  }
}

$("toggleSearch").onclick=()=>{
  $("messageSearchWrap").hidden=
    !$("messageSearchWrap").hidden;
  if(!$("messageSearchWrap").hidden){
    $("chatSearch").focus();
  }else{
    $("chatSearch").value="";
    renderMessages();
  }
};

$("chatSearch").oninput=()=>renderMessages();

function findMessage(id){
  return currentMessages.find(m=>m.id===id);
}

function msgRef(id){
  return doc(db,"chats",activeChat(),"messages",id);
}

function positionPopup(element,x,y){
  element.hidden=false;
  const w=element.offsetWidth;
  const h=element.offsetHeight;
  element.style.left=
    Math.max(8,Math.min(x,innerWidth-w-8))+"px";
  element.style.top=
    Math.max(8,Math.min(y,innerHeight-h-8))+"px";
}

$("messages").addEventListener("click",async event=>{
  const reaction=event.target.closest("[data-react]");
  if(reaction){
    await toggleReaction(
      reaction.dataset.id,
      reaction.dataset.react
    );
    return;
  }

  const button=event.target.closest("[data-menu]");
  if(!button)return;

  const m=findMessage(button.dataset.menu);
  if(!m)return;

  hideMenus();
  contextId=m.id;

  const mine=m.senderId===me.uid;

  $("contextMenu").innerHTML=`
    <button data-action="reply">↩ Ответить</button>
    <button data-action="react">♡ Реакция</button>
    <button data-action="pin">⌁ Закрепить</button>
    ${mine&&m.type!=="sticker"
      ?'<button data-action="edit">✎ Изменить</button>'
      :""}
    ${mine
      ?'<button class="danger" data-action="delete">⌫ Удалить</button>'
      :""}
  `;

  const rect=button.getBoundingClientRect();
  positionPopup($("contextMenu"),rect.left,rect.bottom+5);
});

$("contextMenu").addEventListener("click",async event=>{
  const button=event.target.closest("[data-action]");
  if(!button||!contextId)return;

  const m=findMessage(contextId);
  if(!m)return;

  const action=button.dataset.action;
  const rect=$("contextMenu").getBoundingClientRect();
  hideMenus();

  if(action==="reply"){
    replyTo=m;
    $("replyText").textContent=
      "↩ "+String(m.text||"Стикер").slice(0,120);
    $("replyBar").hidden=false;
    $("message").focus();
  }

  if(action==="react"){
    contextId=m.id;
    $("emojiPicker").innerHTML=EMOJIS.map(emoji=>
      `<button data-emoji="${esc(emoji)}">${emoji}</button>`
    ).join("");
    positionPopup($("emojiPicker"),rect.left,rect.top);
  }

  if(action==="edit"&&m.senderId===me.uid){
    editingId=m.id;
    $("editText").value=m.text||"";
    $("editOverlay").hidden=false;
    $("editText").focus();
  }

  if(action==="delete")await removeMessage(m);
  if(action==="pin")await pinMessage(m);
});

$("emojiPicker").addEventListener("click",async event=>{
  const button=event.target.closest("[data-emoji]");
  if(!button)return;
  const id=contextId;
  hideMenus();
  await toggleReaction(id,button.dataset.emoji);
});

async function toggleReaction(id,emoji){
  if(!me||!activeChat()||!EMOJIS.includes(emoji))return;

  const cid=activeChat();
  const uid=me.uid;

  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"chats",cid,"messages",id);
      const snap=await tx.get(ref);
      if(!snap.exists())throw Error("Сообщение удалено");

      const reactions=snap.data().reactions||{};
      const old=Array.isArray(reactions[emoji])
        ?reactions[emoji]:[];

      const next=old.includes(uid)
        ?old.filter(x=>x!==uid)
        :[...old,uid];

      tx.update(ref,new FieldPath("reactions",emoji),next);
    });
  }catch(err){
    error("Реакция: "+err.message);
  }
}

async function removeMessage(m){
  if(!me||m.senderId!==me.uid)return;
  if(!confirm("Удалить сообщение?"))return;

  const cid=activeChat();

  try{
    await deleteDoc(doc(db,"chats",cid,"messages",m.id));

    if(pinnedId===m.id){
      await updateDoc(doc(db,"chats",cid),{
        pinnedMessageId:null,
        pinnedText:""
      });
    }
  }catch(err){
    error("Удаление: "+err.message);
  }
}

async function pinMessage(m){
  if(!activeChat())return;

  try{
    await updateDoc(doc(db,"chats",activeChat()),{
      pinnedMessageId:m.id,
      pinnedText:String(m.text||"Стикер").slice(0,160)
    });
  }catch(err){
    error("Закрепление: "+err.message);
  }
}

$("unpin").onclick=async()=>{
  if(!activeChat())return;
  try{
    await updateDoc(doc(db,"chats",activeChat()),{
      pinnedMessageId:null,
      pinnedText:""
    });
  }catch(err){
    error(err.message);
  }
};

$("pinned").addEventListener("click",event=>{
  if(event.target.closest("#unpin"))return;

  const target=[...$("messages").querySelectorAll(
    "[data-message]"
  )].find(element=>element.dataset.message===pinnedId);

  target?.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
});

$("editCancel").onclick=()=>{
  editingId=null;
  $("editOverlay").hidden=true;
};

$("editSave").onclick=async()=>{
  const id=editingId;
  const text=$("editText").value.trim();
  const m=findMessage(id);

  if(!id||!m||m.senderId!==me.uid)return;
  if(!text||text.length>2000)return;

  const cid=activeChat();
  $("editSave").disabled=true;

  try{
    await updateDoc(
      doc(db,"chats",cid,"messages",id),
      {text,editedAt:serverTimestamp()}
    );
    editingId=null;
    $("editOverlay").hidden=true;
  }catch(err){
    error("Редактирование: "+err.message);
  }finally{
    $("editSave").disabled=false;
  }
};

$("cancelReply").onclick=clearReply;

async function markRead(cid,peer){
  if(reading||!me||activeUid!==peer)return;

  const unread=currentMessages.filter(m=>
    m.senderId===peer&&!m.readAt
  );

  if(!unread.length)return;

  reading=true;

  try{
    const batch=writeBatch(db);
    unread.forEach(m=>{
      batch.update(
        doc(db,"chats",cid,"messages",m.id),
        {readAt:serverTimestamp()}
      );
    });
    await batch.commit();
  }catch(err){
    console.warn("Read:",err.message);
  }finally{
    reading=false;
  }
}

async function ensureChat(uid){
  const cid=chatId(me.uid,uid);
  const ref=doc(db,"chats",cid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      participants:[me.uid,uid].sort(),
      updatedAt:serverTimestamp(),
      lastText:""
    });
  }
  return cid;
}

async function sendMessage(payload){
  if(!me||!activeUid)return;

  const uid=activeUid;
  const cid=await ensureChat(uid);

  if(activeUid!==uid){
    throw Error("Диалог изменился");
  }

  const batch=writeBatch(db);
  const preview=payload.type==="sticker"
    ?"Стикер"
    :(payload.text||"").slice(0,100);

  batch.set(
    doc(db,"chats",cid),
    {
      participants:[me.uid,uid].sort(),
      updatedAt:serverTimestamp(),
      lastText:preview
    },
    {merge:true}
  );

  const data={
    senderId:me.uid,
    type:payload.type||"text",
    text:payload.text||"",
    sticker:payload.sticker||"",
    createdAt:serverTimestamp()
  };

  if(payload.replyTo){
    data.replyTo=payload.replyTo;
    data.replyText=payload.replyText||"";
  }

  batch.set(
    doc(collection(db,"chats",cid,"messages")),
    data
  );

  await batch.commit();
}

$("form").onsubmit=async event=>{
  event.preventDefault();
  if(sending)return;

  const text=$("message").value.trim();
  if(!text||text.length>2000)return;

  sending=true;
  $("send").disabled=true;
  const uid=activeUid;

  try{
    const payload={type:"text",text};

    if(replyTo){
      payload.replyTo=replyTo.id;
      payload.replyText=String(
        replyTo.text||"Стикер"
      ).slice(0,160);
    }

    await sendMessage(payload);

    if(uid===activeUid){
      $("message").value="";
      resizeComposer();
      clearReply();
      setTyping(false);
    }
  }catch(err){
    error("Отправка: "+err.message);
  }finally{
    sending=false;
    $("send").disabled=!activeUid;
  }
};

function resizeComposer(){
  const element=$("message");
  element.style.height="auto";
  element.style.height=
    Math.min(element.scrollHeight,145)+"px";
}

$("message").addEventListener("input",()=>{
  resizeComposer();
  if(!activeUid)return;

  setTyping(Boolean($("message").value.trim()));
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>setTyping(false),2500);
});

$("message").addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    $("form").requestSubmit();
  }
});

async function setTyping(value){
  if(!me||!activeUid||typingActive===value)return;

  const uid=activeUid;
  typingActive=value;

  try{
    const cid=await ensureChat(uid);
    if(activeUid!==uid)return;

    await setDoc(
      doc(db,"chats",cid,"typing",me.uid),
      {
        uid:me.uid,
        typing:value,
        updatedAt:serverTimestamp()
      }
    );
  }catch(err){
    typingActive=false;
    console.warn("Typing:",err.message);
  }
}

$("back").onclick=()=>{
  $("app").classList.remove("open");
  $("stickerPanel").hidden=true;
};

function renderStickerPacks(){
  $("stickerPack").innerHTML=STICKER_PACKS.map(p=>
    `<option value="${esc(p.id)}">${esc(p.title)}</option>`
  ).join("");
  renderStickers();
}

function renderStickers(){
  const pack=STICKER_PACKS.find(
    p=>p.id===$("stickerPack").value
  );

  $("stickerGrid").innerHTML=pack?.files.length
    ?pack.files.map(file=>{
      const key=pack.id+"/"+file;
      return `<button data-sticker="${esc(key)}">
        <img src="${esc(stickerSource(key))}" alt="Стикер">
      </button>`;
    }).join("")
    :'<div class="hint">Стикеры ещё не загружены</div>';
}

$("stickerPack").onchange=renderStickers;

$("stickers").onclick=()=>{
  $("stickerPanel").hidden=!$("stickerPanel").hidden;
};

$("stickerGrid").onclick=async event=>{
  const button=event.target.closest("[data-sticker]");
  if(!button)return;

  button.disabled=true;
  try{
    await sendMessage({
      type:"sticker",
      sticker:button.dataset.sticker
    });
    $("stickerPanel").hidden=true;
  }catch(err){
    error(err.message);
  }finally{
    button.disabled=false;
  }
};

renderStickerPacks();

onAuthStateChanged(auth,async user=>{
  stopChats?.();
  stopChats=null;
  stopActive();
  activeUid=null;
  me=user;

  if(!user){
    $("chats").innerHTML=`
      <div class="empty">
        Войди в аккаунт, чтобы открыть сообщения.
        <a href="./index.html">На главную</a>
      </div>`;
    return;
  }

  stopChats=onSnapshot(
    query(
      collection(db,"chats"),
      where("participants","array-contains",user.uid),
      limit(100)
    ),
    snap=>{
      chatRecords=snap.docs.sort((a,b)=>
        (b.data().updatedAt?.seconds||0)-
        (a.data().updatedAt?.seconds||0)
      );
      renderChats();
    },
    err=>error("Диалоги: "+err.message)
  );

  try{
    const snap=await getDocs(
      query(collection(db,"users"),limit(100))
    );

    if(auth.currentUser?.uid!==user.uid)return;

    users={};
    snap.forEach(d=>users[d.id]=d.data());

    renderChats();
    searchUsers();

    const requested=new URLSearchParams(
      location.search
    ).get("user");

    if(requested&&requested!==user.uid){
      openChat(requested);
    }
  }catch(err){
    error("Пользователи: "+err.message);
  }
});
</script>
