
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d17">
<title>NEXORA | Сообщения</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090d17;
  --panel:#151e30;
  --line:#ffffff17;
  --text:#f1f5ff;
  --muted:#93a1bc;
  --accent:#8c9cff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font:14px system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 0% 0%,#344f8a55,transparent 55%),
    radial-gradient(ellipse at 100% 100%,#684b9650,transparent 55%),
    var(--bg);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}
a{color:#b6c7ff;text-decoration:none}
.app{
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  gap:14px;
  max-width:1450px;
  height:100dvh;
  padding:15px;
  margin:auto;
}
.panel{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  background:#151e30e8;
  backdrop-filter:blur(22px);
  box-shadow:0 15px 45px #0004;
}
.sidehead{padding:22px 18px 15px}
.logo{
  font-size:18px;
  font-weight:900;
  letter-spacing:3px;
}
.logo span{color:#a4b2ff}
.sidehead h1{font-size:25px;margin:25px 0 15px}
input,textarea{
  width:100%;
  padding:12px 14px;
  color:white;
  background:#0b1424;
  border:1px solid #ffffff20;
  border-radius:12px;
  outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
.section{
  padding:15px 18px 8px;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.scroll{overflow:auto;min-height:0;scrollbar-width:thin}
#people{max-height:30%;flex-shrink:0}
#chats{flex:1}
.person{
  display:flex;
  align-items:center;
  gap:12px;
  width:calc(100% - 16px);
  margin:3px 8px;
  padding:12px;
  border:1px solid transparent;
  border-radius:15px;
  color:white;
  background:transparent;
  text-align:left;
}
.person:hover{background:#ffffff0c}
.person.active{
  background:#8494ff23;
  border-color:#a6b5ff30;
}
.avatar{
  width:46px;
  height:46px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  border-radius:16px;
  background:linear-gradient(135deg,#667cce,#9a71bd);
  font-weight:800;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{
  display:flex;
  align-items:center;
  gap:5px;
  font-weight:800;
}
.preview{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.badge{width:18px;height:18px;object-fit:contain}
.footer{
  padding:15px 18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}
.chathead{
  height:78px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
}
.peerinfo{flex:1;min-width:0}
#peer{font-size:16px;font-weight:800;display:flex;gap:6px}
#status{margin-top:5px;color:var(--muted);font-size:12px}
#status.online{color:#79e7b5}
#status.typing{color:#b2bdff}
.iconbtn{
  width:38px;height:38px;
  border:0;
  border-radius:12px;
  color:#d2dcf2;
  background:transparent;
  font-size:20px;
}
.iconbtn:hover{background:#ffffff15}
#back{display:none}
#pinned{
  margin:10px 16px 0;
  padding:10px 13px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #91a2ff35;
  border-radius:12px;
  background:#7c8fff17;
}
#pinnedText{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
#chatSearchWrap{padding:10px 16px 0}
.messages{
  display:flex;
  flex-direction:column;
  gap:9px;
  flex:1;
  padding:20px;
  overflow:auto;
  min-height:0;
}
.day{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--muted);
  font-size:11px;
  margin:14px 0;
}
.day:before,.day:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1;
}
.message-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}
.message-row.mine{justify-content:flex-end}
.bubble{
  max-width:min(78%,520px);
  padding:11px 13px;
  border-radius:17px 17px 17px 5px;
  background:#293750;
  overflow-wrap:anywhere;
  animation:appear .2s ease;
}
.mine .bubble{
  border-radius:17px 17px 5px 17px;
  background:linear-gradient(135deg,#4b64b0,#7161ac);
}
.bubble.sticker{background:transparent}
.sticker img{width:150px;height:150px;object-fit:contain}
.msgtext{white-space:pre-wrap;line-height:1.55}
.meta{
  margin-top:6px;
  font-size:10px;
  color:#e2e7ffb3;
  text-align:right;
}
.quote{
  padding:7px 9px;
  margin-bottom:8px;
  border-left:3px solid #a7baff;
  border-radius:5px;
  background:#ffffff13;
  font-size:12px;
}
.reactions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.reaction{
  border:1px solid #ffffff24;
  border-radius:20px;
  background:#ffffff15;
  color:white;
  padding:4px 9px;
}
.reaction.selected{background:#a2b5ff55}
.more{
  border:0;
  background:transparent;
  color:#a7b4ce;
  padding:8px;
  opacity:0;
}
.message-row:hover .more{opacity:1}
.empty{
  margin:auto;
  max-width:320px;
  padding:25px;
  text-align:center;
  color:var(--muted);
  line-height:1.7;
}
.empty b{display:block;font-size:19px;color:white}
.composer-area{
  padding:12px 17px;
  border-top:1px solid var(--line);
  position:relative;
}
#replyBar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
  padding:9px 12px;
  background:#788cff24;
  border-radius:12px;
}
#replyText{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.composer{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:7px;
  background:#0b1424;
  border:1px solid #ffffff20;
  border-radius:17px;
}
.composer:focus-within{border-color:#8a9cff88}
.composer textarea{
  flex:1;
  min-width:0;
  min-height:40px;
  max-height:140px;
  padding:10px 5px;
  resize:none;
  border:0;
  background:transparent;
}
.send{
  width:42px;height:42px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#7287ff,#9a7fe7);
  color:white;
  font-size:19px;
}
.popup{
  position:fixed;
  z-index:20;
  background:#1b2941;
  border:1px solid #ffffff30;
  border-radius:14px;
  box-shadow:0 15px 40px #0009;
}
#menu{width:190px;padding:6px}
#menu button{
  width:100%;
  padding:10px;
  text-align:left;
  border:0;
  border-radius:8px;
  color:white;
  background:transparent;
}
#menu button:hover{background:#ffffff16}
#emojiPicker{display:flex;padding:8px;gap:4px}
#emojiPicker button{
  background:transparent;
  border:0;
  font-size:21px;
  padding:6px;
}
#stickerPanel{
  position:absolute;
  bottom:100%;
  left:15px;
  width:min(340px,calc(100% - 30px));
  padding:12px;
}
#stickerPanel select{
  width:100%;
  padding:10px;
  border-radius:9px;
  background:#0b1424;
  color:white;
}
#stickerGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  max-height:270px;
  overflow:auto;
  margin-top:10px;
}
#stickerGrid button{border:0;background:#ffffff10}
#stickerGrid img{width:100%}
#error{
  margin:10px 16px;
  padding:10px;
  background:#7a304555;
  border-radius:10px;
  color:#ffbec8;
}
.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:15px;
  background:#030711cc;
  backdrop-filter:blur(8px);
}
.dialog{
  width:min(430px,100%);
  padding:22px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#1a263b;
}
.dialog textarea{min-height:120px;resize:vertical}
.dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:14px;
}
.btn{
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#293950;
  color:white;
}
.btn.primary{background:#7b8fe9}
@keyframes appear{
  from{opacity:.4;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
@media(max-width:700px){
  .app{display:block;padding:0}
  .panel{height:100dvh;border:0;border-radius:0}
  .app:not(.open) #conversation{display:none}
  .app.open #sidebar{display:none}
  #back{display:block}
  .messages{padding:12px}
  .bubble{max-width:83%}
  .more{opacity:1}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="app" id="app">
  <aside class="panel" id="sidebar">
    <div class="sidehead">
      <div class="logo">✦ NEX<span>ORA</span></div>
      <h1>Сообщения</h1>
      <input id="search" type="search"
        placeholder="Поиск пользователей">
    </div>
    <div id="people" class="scroll"></div>
    <div class="section">Мои диалоги</div>
    <div id="chats" class="scroll">
      <div class="empty">Загрузка...</div>
    </div>
    <div class="footer">
      <span>NEXORA</span>
      <a href="./index.html">Главная ↗</a>
    </div>
  </aside>

  <section class="panel" id="conversation">
    <div class="chathead">
      <button id="back" class="iconbtn">←</button>
      <div id="peerAvatar" class="avatar">N</div>
      <div class="peerinfo">
        <div id="peer">Выбери диалог</div>
        <div id="status">Личные сообщения</div>
      </div>
      <button id="toggleSearch" class="iconbtn"
        title="Поиск в переписке">⌕</button>
    </div>

    <div id="error" hidden></div>

    <div id="pinned" hidden>
      📌 <span id="pinnedText"></span>
      <button id="unpin" class="iconbtn">×</button>
    </div>

    <div id="chatSearchWrap" hidden>
      <input id="chatSearch" type="search"
        placeholder="Поиск в переписке">
    </div>

    <div id="messages" class="messages">
      <div class="empty">
        <b>Твои сообщения</b>
        Выбери пользователя, чтобы начать общение.
      </div>
    </div>

    <div class="composer-area">
      <div id="replyBar" hidden>
        <span id="replyText"></span>
        <button id="cancelReply" class="iconbtn">×</button>
      </div>

      <div id="stickerPanel" class="popup" hidden>
        <select id="stickerPack"></select>
        <div id="stickerGrid"></div>
      </div>

      <form id="form" class="composer">
        <button type="button" id="stickers"
          class="iconbtn" disabled>☺</button>
        <textarea id="message" rows="1"
          maxlength="2000"
          placeholder="Написать сообщение..."
          disabled></textarea>
        <button id="send" class="send" disabled>➤</button>
      </form>
    </div>
  </section>
</main>

<div id="menu" class="popup" hidden></div>
<div id="emojiPicker" class="popup" hidden></div>

<div id="editOverlay" class="overlay" hidden>
  <div class="dialog">
    <h2>Редактировать сообщение</h2>
    <textarea id="editText" maxlength="2000"></textarea>
    <div class="dialog-actions">
      <button id="editCancel" class="btn">Отмена</button>
      <button id="editSave" class="btn primary">Сохранить</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {getAuth,onAuthStateChanged} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,collection,doc,getDoc,getDocs,
  query,where,limit,orderBy,onSnapshot,
  writeBatch,serverTimestamp,setDoc,updateDoc,
  deleteDoc,runTransaction,FieldPath
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyD9prfvOQGMeniL3U8WD2HeeZ6NNArY8J8",
  authDomain:"toolchat-bfac8.firebaseapp.com",
  projectId:"toolchat-bfac8",
  storageBucket:"toolchat-bfac8.firebasestorage.app",
  messagingSenderId:"52396840735",
  appId:"1:52396840735:web:a608b9c037c8481f2dc22a"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let me=null;
let users={};
let activeUid=null;
let chatRecords=[];
let currentMessages=[];
let stopChats=null;
let stopMessages=null;
let stopPresence=null;
let stopTyping=null;
let stopPin=null;
let generation=0;
let replyTo=null;
let editingId=null;
let contextId=null;
let pinnedId=null;
let peerOnline=false;
let peerTyping=false;
let typingActive=false;
let typingTimer=null;
let reading=false;
let readPending=false;
let sending=false;

const EMOJIS=["❤️","👍","😂","😮","😢","🔥"];

const STICKER_PACKS=[
  {id:"kemomimiori",title:"Kemomimiori",files:[]}
];

const esc=value=>String(value??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp",
    "<":"&lt",
    ">":"&gt",
    '"':"&quot",
    "'":"&#39"
  })[c]+";"
);

function chatId(a,b){
  return [a,b].sort().join("_");
}

function activeChat(){
  return me&&activeUid
    ?chatId(me.uid,activeUid)
    :null;
}

function safeImage(value){
  try{
    const u=new URL(value);
    return u.protocol==="https:" &&
      !u.username&&!u.password?u.href:"";
  }catch{return ""}
}

function avatar(user){
  const url=safeImage(user?.avatarUrl);
  return url
    ?`<img src="${esc(url)}" alt=""
       loading="lazy" referrerpolicy="no-referrer">`
    :esc((user?.name||"N").slice(0,2).toUpperCase());
}

function badge(user){
  const v=Number(user?.verification||0);
  return v>=1&&v<=5
    ?`<img class="badge"
       src="./image/Verified_${v}.png"
       alt="Верификация">`
    :"";
}

function personRow(uid,preview=""){
  const user=users[uid]||{};
  return `
    <button class="person ${uid===activeUid?"active":""}"
      data-user="${esc(uid)}">
      <span class="avatar">${avatar(user)}</span>
      <span class="info">
        <span class="name">
          ${esc(user.name||"Пользователь")}
          ${badge(user)}
        </span>
        <div class="preview">${esc(preview)}</div>
      </span>
    </button>`;
}

function showError(message){
  $("error").hidden=false;
  $("error").textContent=message;
}

function clearError(){
  $("error").hidden=true;
  $("error").textContent="";
}

function searchUsers(){
  if(!me)return;
  const term=$("search").value.toLowerCase().trim();

  if(!term){
    $("people").innerHTML="";
    return;
  }

  const matches=Object.keys(users).filter(uid=>
    uid!==me.uid &&
    String(users[uid].name||"")
      .toLowerCase().includes(term)
  ).slice(0,30);

  $("people").innerHTML=matches.map(uid=>
    personRow(uid,"Начать диалог")
  ).join("")||'<div class="empty">Не найдено</div>';
}

$("search").oninput=searchUsers;

document.addEventListener("click",event=>{
  const button=event.target.closest("[data-user]");
  if(button)openChat(button.dataset.user);

  if(!event.target.closest("#menu") &&
     !event.target.closest("#emojiPicker") &&
     !event.target.closest("[data-menu]")){
    hideMenus();
  }
});

function renderChats(){
  if(!me)return;

  $("chats").innerHTML=chatRecords.map(item=>{
    const data=item.data();
    const other=data.participants?.find(
      uid=>uid!==me.uid
    );
    return other
      ?personRow(other,data.lastText||"Диалог")
      :"";
  }).join("")||
    '<div class="empty">Диалогов пока нет</div>';
}

function updateStatus(){
  const element=$("status");
  element.className="";

  if(peerTyping){
    element.textContent="Печатает...";
    element.className="typing";
  }else if(peerOnline){
    element.textContent="● Недавно был активен";
    element.className="online";
  }else{
    element.textContent="Не в сети";
  }
}

function clearReply(){
  replyTo=null;
  $("replyBar").hidden=true;
}

function hideMenus(){
  $("menu").hidden=true;
  $("emojiPicker").hidden=true;
}

function stopActive(){
  stopMessages?.();
  stopPresence?.();
  stopTyping?.();
  stopPin?.();

  stopMessages=null;
  stopPresence=null;
  stopTyping=null;
  stopPin=null;

  clearTimeout(typingTimer);
  generation++;
  currentMessages=[];
  clearReply();
  editingId=null;
  pinnedId=null;
  peerOnline=false;
  peerTyping=false;
  typingActive=false;

  hideMenus();
  $("pinned").hidden=true;
  $("chatSearchWrap").hidden=true;
  $("chatSearch").value="";
}

async function openChat(uid){
  if(!me||uid===me.uid)return;

  stopActive();
  activeUid=uid;
  const g=generation;
  clearError();

  $("app").classList.add("open");
  $("messages").innerHTML=
    '<div class="empty">Загрузка сообщений...</div>';

  $("message").disabled=true;
  $("send").disabled=true;
  $("stickers").disabled=true;

  try{
    if(!users[uid]){
      const snap=await getDoc(doc(db,"users",uid));
      if(!snap.exists())throw Error("Пользователь не найден");
      users[uid]=snap.data();
    }

    if(g!==generation)return;

    const user=users[uid];

    $("peer").innerHTML=
      esc(user.name||"Пользователь")+badge(user);
    $("peerAvatar").innerHTML=avatar(user);

    $("message").disabled=false;
    $("send").disabled=false;
    $("stickers").disabled=false;

    renderChats();
    searchUsers();

    const cid=chatId(me.uid,uid);

    stopPresence=onSnapshot(
      doc(db,"presence",uid),
      snap=>{
        if(g!==generation)return;
        const last=snap.data()?.lastSeen?.toMillis?.()||0;
        peerOnline=last>0&&Date.now()-last<120000;
        updateStatus();
      },
      ()=>{}
    );

    stopTyping=onSnapshot(
      doc(db,"chats",cid,"typing",uid),
      snap=>{
        if(g!==generation)return;
        const data=snap.data();
        const last=data?.updatedAt?.toMillis?.()||0;
        peerTyping=Boolean(
          data?.typing&&last&&Date.now()-last<10000
        );
        updateStatus();
      },
      ()=>{}
    );

    stopPin=onSnapshot(
      doc(db,"chats",cid),
      snap=>{
        if(g!==generation)return;
        pinnedId=snap.data()?.pinnedMessageId||null;
        $("pinnedText").textContent=
          snap.data()?.pinnedText||"Сообщение";
        $("pinned").hidden=!pinnedId;
      },
      ()=>{}
    );

    stopMessages=onSnapshot(
      query(
        collection(db,"chats",cid,"messages"),
        orderBy("createdAt","desc"),
        limit(100)
      ),
      snap=>{
        if(g!==generation)return;
        const first=currentMessages.length===0;

        currentMessages=snap.docs.map(d=>({
          id:d.id,...d.data()
        })).reverse();

        renderMessages(first);
        markRead(cid,uid);
      },
      err=>showError("Сообщения: "+err.message)
    );
  }catch(err){
    if(g===generation)showError(err.message);
  }
}

function stickerSource(key){
  if(typeof key!=="string")return "";
  const parts=key.split("/");
  if(parts.length!==2)return "";

  const pack=STICKER_PACKS.find(p=>p.id===parts[0]);
  if(!pack||!pack.files.includes(parts[1]))return "";

  return "./image/stic/"+parts[0]+"/"+parts[1];
}

function renderMessages(forceBottom=false){
  const box=$("messages");
  const oldTop=box.scrollTop;
  const nearBottom=
    box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const term=$("chatSearch").value.toLowerCase().trim();

  const messages=term
    ?currentMessages.filter(m=>
      String(m.text||"").toLowerCase().includes(term)
    )
    :currentMessages;

  let html="";
  let lastDay="";

  for(const m of messages){
    const date=m.createdAt?.toDate?.();
    const day=date
      ?date.toLocaleDateString("ru-RU")
      :"";
    const time=date
      ?date.toLocaleTimeString("ru-RU",{
        hour:"2-digit",minute:"2-digit"
      })
      :"";

    if(day&&day!==lastDay){
      html+=`<div class="day">${esc(day)}</div>`;
      lastDay=day;
    }

    const mine=m.senderId===me.uid;
    const sticker=m.type==="sticker";
    const src=sticker?stickerSource(m.sticker):"";

    const reactions=m.reactions||{};
    const reactionHTML=EMOJIS.map(emoji=>{
      const ids=Array.isArray(reactions[emoji])
        ?reactions[emoji]:[];

      if(!ids.length)return "";

      return `
        <button class="reaction
          ${ids.includes(me.uid)?"selected":""}"
          data-react="${esc(emoji)}"
          data-id="${esc(m.id)}">
          ${emoji} ${ids.length}
        </button>`;
    }).join("");

    html+=`
      <div class="message-row ${mine?"mine":""}"
        data-message="${esc(m.id)}">

        ${mine?`
          <button class="more"
            data-menu="${esc(m.id)}">⋯</button>`:""}

        <div class="bubble ${sticker?"sticker":""}">
          ${m.replyText?`
            <div class="quote">
              ↩ ${esc(m.replyText)}
            </div>`:""}

          ${sticker
            ?src
              ?`<img src="${esc(src)}" alt="Стикер">`
              :"<span>Стикер недоступен</span>"
            :`<div class="msgtext">
                ${esc(m.text||"")}
              </div>`}

          <div class="meta">
            ${m.editedAt?"изменено · ":""}
            ${esc(time)}
            ${mine?(m.readAt?"✓✓":"✓"):""}
          </div>

          ${reactionHTML?`
            <div class="reactions">
              ${reactionHTML}
            </div>`:""}
        </div>

        ${!mine?`
          <button class="more"
            data-menu="${esc(m.id)}">⋯</button>`:""}
      </div>`;
  }

  box.innerHTML=html||
    '<div class="empty"><b>Пока пусто</b>Напиши первое сообщение.</div>';

  if(!term&&(forceBottom||nearBottom)){
    box.scrollTop=box.scrollHeight;
  }else{
    box.scrollTop=oldTop;
  }
}

$("toggleSearch").onclick=()=>{
  $("chatSearchWrap").hidden=!$("chatSearchWrap").hidden;

  if(!$("chatSearchWrap").hidden){
    $("chatSearch").focus();
  }else{
    $("chatSearch").value="";
    renderMessages();
  }

$("chatSearch").oninput=()=>renderMessages();

function findMessage(id){
  return currentMessages.find(m=>m.id===id);
}

function msgRef(id){
  return doc(db,"chats",activeChat(),"messages",id);
}

function positionPopup(element,x,y){
  element.hidden=false;
  const w=element.offsetWidth;
  const h=element.offsetHeight;

  element.style.left=
    Math.max(8,Math.min(x,innerWidth-w-8))+"px";
  element.style.top=
    Math.max(8,Math.min(y,innerHeight-h-8))+"px";
}

$("messages").addEventListener("click",async event=>{
  const reaction=event.target.closest("[data-react]");

  if(reaction){
    await toggleReaction(
      reaction.dataset.id,
      reaction.dataset.react
    );
    return;
  }

  const button=event.target.closest("[data-menu]");
  if(!button)return;

  const m=findMessage(button.dataset.menu);
  if(!m)return;

  hideMenus();
  contextId=m.id;

  const mine=m.senderId===me.uid;

  $("menu").innerHTML=`
    <button data-action="reply">↩ Ответить</button>
    <button data-action="react">♡ Реакция</button>
    <button data-action="pin">📌 Закрепить</button>
    ${mine&&m.type!=="sticker"
      ?'<button data-action="edit">✎ Изменить</button>'
      :""}
    ${mine
      ?'<button data-action="delete">⌫ Удалить</button>'
      :""}
  `;

  const rect=button.getBoundingClientRect();
  positionPopup($("menu"),rect.left,rect.bottom+5);
});

$("menu").addEventListener("click",async event=>{
  const button=event.target.closest("[data-action]");
  if(!button||!contextId)return;

  const m=findMessage(contextId);
  if(!m)return;

  const action=button.dataset.action;
  const rect=$("menu").getBoundingClientRect();

  hideMenus();

  if(action==="reply"){
    replyTo=m;
    $("replyText").textContent=
      "↩ "+String(m.text||"Стикер").slice(0,120);
    $("replyBar").hidden=false;
    $("message").focus();
  }

  if(action==="react"){
    contextId=m.id;
    $("emojiPicker").innerHTML=EMOJIS.map(emoji=>
      `<button data-emoji="${esc(emoji)}">
        ${emoji}
      </button>`
    ).join("");

    positionPopup($("emojiPicker"),rect.left,rect.top);
  }

  if(action==="edit"&&m.senderId===me.uid){
    editingId=m.id;
    $("editText").value=m.text||"";
    $("editOverlay").hidden=false;
    $("editText").focus();
  }

  if(action==="delete")await removeMessage(m);
  if(action==="pin")await pinMessage(m);
});

$("emojiPicker").addEventListener("click",async event=>{
  const button=event.target.closest("[data-emoji]");
  if(!button)return;

  const id=contextId;
  hideMenus();
  await toggleReaction(id,button.dataset.emoji);
});

async function toggleReaction(id,emoji){
  if(!me||!activeChat()||!EMOJIS.includes(emoji))return;

  const cid=activeChat();
  const uid=me.uid;

  try{
    await runTransaction(db,async tx=>{
      const ref=doc(db,"chats",cid,"messages",id);
      const snap=await tx.get(ref);

      if(!snap.exists()){
        throw Error("Сообщение удалено");
      }

      const reactions=snap.data().reactions||{};
      const old=Array.isArray(reactions[emoji])
        ?reactions[emoji]:[];

      const next=old.includes(uid)
        ?old.filter(x=>x!==uid)
        :[...old,uid];

      tx.update(
        ref,
        new FieldPath("reactions",emoji),
        next
      );
    });
  }catch(err){
    showError("Реакция: "+err.message);
  }
}

async function removeMessage(m){
  if(!me||m.senderId!==me.uid)return;
  if(!confirm("Удалить сообщение?"))return;

  const cid=activeChat();

  try{
    await deleteDoc(
      doc(db,"chats",cid,"messages",m.id)
    );

    if(pinnedId===m.id){
      await updateDoc(doc(db,"chats",cid),{
        pinnedMessageId:null,
        pinnedText:""
      });
    }
  }catch(err){
    showError("Удаление: "+err.message);
  }
}

async function pinMessage(m){
  if(!activeChat())return;

  try{
    await updateDoc(doc(db,"chats",activeChat()),{
      pinnedMessageId:m.id,
      pinnedText:String(m.text||"Стикер").slice(0,160)
    });
  }catch(err){
    showError("Закрепление: "+err.message);
  }
}

$("unpin").onclick=async()=>{
  if(!activeChat())return;

  try{
    await updateDoc(doc(db,"chats",activeChat()),{
      pinnedMessageId:null,
      pinnedText:""
    });
  }catch(err){
    showError(err.message);
  }
};

$("pinned").addEventListener("click",event=>{
  if(event.target.closest("#unpin"))return;

  const target=[...$("messages").querySelectorAll(
    "[data-message]"
  )].find(el=>el.dataset.message===pinnedId);

  });
});

$("editCancel").onclick=()=>{
  editingId=null;
  $("editOverlay").hidden=true;
};

$("editSave").onclick=async()=>{
  const id=editingId;
  const text=$("editText").value.trim();
  const m=findMessage(id);

  if(!id||!m||m.senderId!==me.uid)return;
  if(!text||text.length>2000)return;

  const cid=activeChat();
  $("editSave").disabled=true;

  try{
    await updateDoc(
      doc(db,"chats",cid,"messages",id),
      {text,editedAt:serverTimestamp()}
    );

    editingId=null;
    $("editOverlay").hidden=true;
  }catch(err){
    showError("Редактирование: "+err.message);
  }finally{
    $("editSave").disabled=false;
  }
};

$("cancelReply").onclick=clearReply;

async function markRead(cid,peer){
  if(reading){
    readPending=true;
    return;
  }

  if(!me||activeUid!==peer)return;

  const unread=currentMessages.filter(m=>
    m.senderId===peer&&!m.readAt
  );

  if(!unread.length)return;
  reading=true;

  try{
    const batch=writeBatch(db);

    unread.forEach(m=>{
      batch.update(
        doc(db,"chats",cid,"messages",m.id),
        {readAt:serverTimestamp()}
      );
    });

    await batch.commit();
  }catch(err){
    console.warn("Read receipts:",err.message);
  }finally{
    reading=false;

    if(readPending){
      readPending=false;
      if(activeUid===peer)markRead(cid,peer);
    }
  }
}

async function ensureChat(uid){
  const cid=chatId(me.uid,uid);
  const ref=doc(db,"chats",cid);
  const snap=await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{
      participants:[me.uid,uid].sort(),
      updatedAt:serverTimestamp(),
      lastText:""
    });
  }

  return cid;
}

async function sendMessage(payload){
  if(!me||!activeUid)return;

  const uid=activeUid;
  const cid=await ensureChat(uid);

  if(activeUid!==uid){
    throw Error("Диалог изменился");
  }

  const batch=writeBatch(db);

  const preview=payload.type==="sticker"
    ?"Стикер"
    :(payload.text||"").slice(0,100);

  batch.set(
    doc(db,"chats",cid),
    {
      participants:[me.uid,uid].sort(),
      updatedAt:serverTimestamp(),
      lastText:preview
    },
    {merge:true}
  );

  const data={
    senderId:me.uid,
    type:payload.type||"text",
    text:payload.text||"",
    sticker:payload.sticker||"",
    createdAt:serverTimestamp()
  };

  if(payload.replyTo){
    data.replyTo=payload.replyTo;
    data.replyText=payload.replyText||"";
  }

  batch.set(
    doc(collection(db,"chats",cid,"messages")),
    data
  );

  await batch.commit();
}

$("form").onsubmit=async event=>{
  event.preventDefault();
  if(sending)return;

  const text=$("message").value.trim();
  if(!text||text.length>2000)return;

  sending=true;
  $("send").disabled=true;
  const uid=activeUid;

  try{
    const payload={type:"text",text};

    if(replyTo){
      payload.replyTo=replyTo.id;
      payload.replyText=String(
        replyTo.text||"Стикер"
      ).slice(0,160);
    }

    await sendMessage(payload);

    if(uid===activeUid){
      $("message").value="";
      resizeComposer();
      clearReply();
      setTyping(false);
    }
  }catch(err){
    showError("Отправка: "+err.message);
  }finally{
    sending=false;
    $("send").disabled=!activeUid;
  }
};

function resizeComposer(){
  const el=$("message");
  el.style.height="auto";
  el.style.height=
    Math.min(el.scrollHeight,140)+"px";
}

$("message").addEventListener("input",()=>{
  resizeComposer();
  if(!activeUid)return;

  setTyping(Boolean($("message").value.trim()));
  clearTimeout(typingTimer);

  typingTimer=setTimeout(()=>{
    setTyping(false);
  },2500);
});

$("message").addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    $("form").requestSubmit();
  }
});

async function setTyping(value){
  if(!me||!activeUid||typingActive===value)return;

  const uid=activeUid;
  typingActive=value;

  try{
    const cid=await ensureChat(uid);
    if(activeUid!==uid)return;

    await setDoc(
      doc(db,"chats",cid,"typing",me.uid),
      {
        uid:me.uid,
        typing:value,
        updatedAt:serverTimestamp()
      }
    );
  }catch(err){
    typingActive=false;
    console.warn("Typing:",err.message);
  }
}

$("back").onclick=()=>{

};

function renderStickerPacks(){
  $("stickerPack").innerHTML=STICKER_PACKS.map(p=>
    `<option value="${esc(p.id)}">
      ${esc(p.title)}
    </option>`
  ).join("");

  renderStickers();
}

function renderStickers(){
  const pack=STICKER_PACKS.find(
    p=>p.id===$("stickerPack").value
  );

  $("stickerGrid").innerHTML=pack?.files.length
    ?pack.files.map(file=>{
      const key=pack.id+"/"+file;
      return `
        <button data-sticker="${esc(key)}">
          <img src="${esc(stickerSource(key))}"
            alt="Стикер">
        </button>`;
    }).join("")
    :'<div style="color:#93a1bc">Стикеры ещё не загружены</div>';
}

$("stickerPack").onchange=renderStickers;

$("stickers").onclick=()=>{
  $("stickerPanel").hidden=!$("stickerPanel").hidden;
};

$("stickerGrid").onclick=async event=>{
  const button=event.target.closest("[data-sticker]");
  if(!button)return;

  button.disabled=true;

  try{
    await sendMessage({
      type:"sticker",
      sticker:button.dataset.sticker
    });

    $("stickerPanel").hidden=true;
  }catch(err){
    showError(err.message);
  }finally{
    button.disabled=false;
  }
};

renderStickerPacks();

onAuthStateChanged(auth,async user=>{
  stopChats?.();
  stopChats=null;
  stopActive();

  activeUid=null;
  me=user;

  if(!user){
    $("chats").innerHTML=`
      <div class="empty">
        Войди в аккаунт, чтобы открыть сообщения.
        <a href="./index.html">На главную</a>
      </div>`;
    return;
  }

  stopChats=onSnapshot(
    query(
      collection(db,"chats"),
      where("participants","array-contains",user.uid),
      limit(100)
    ),
    snap=>{
      chatRecords=snap.docs.sort((a,b)=>
        (b.data().updatedAt?.seconds||0)-
        (a.data().updatedAt?.seconds||0)
      );

      renderChats();
    },
    err=>showError("Диалоги: "+err.message)
  );

  try{
    const snap=await getDocs(
      query(collection(db,"users"),limit(100))
    );

    if(auth.currentUser?.uid!==user.uid)return;

    users={};
    snap.forEach(d=>{
      users[d.id]=d.data();
    });

    renderChats();
    searchUsers();

    const requested=new URLSearchParams(
      location.search
    ).get("user");

    if(requested&&requested!==user.uid){
      openChat(requested);
    }
  }catch(err){
    showError("Пользователи: "+err.message);
  }
});
