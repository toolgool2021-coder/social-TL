
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d19">
<title>NEXORA 2.2 | Сообщения</title>
<style>
:root{
 color-scheme:dark;
 --bg:#080d19;
 --panel:#141d31ed;
 --line:#ffffff20;
 --text:#edf3ff;
 --muted:#9baac5;
 --blue:#82a9ff
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100dvh;
 font:14px system-ui,sans-serif;color:var(--text);
 background:
 radial-gradient(ellipse at 15% 5%,#315b9b40,transparent 55%),
 radial-gradient(ellipse at 90% 90%,#6743ac30,transparent 55%),
 var(--bg)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
a{color:#b3c9ff;text-decoration:none}
[hidden]{display:none!important}
header{
 height:64px;padding:0 max(16px,calc((100vw - 1180px)/2));
 display:flex;align-items:center;justify-content:space-between;
 background:#0c1424ee;border-bottom:1px solid var(--line)
}
.brand{font-size:19px;font-weight:900}
.brand span{font-size:10px;color:var(--blue)}
#layout{
 max-width:1180px;height:calc(100dvh - 88px);
 min-height:380px;margin:12px auto;padding:0 12px;
 display:grid;grid-template-columns:310px minmax(0,1fr);gap:12px
}
.glass{
 display:flex;flex-direction:column;min-width:0;min-height:0;
 overflow:hidden;background:var(--panel);
 border:1px solid var(--line);border-radius:19px;
 backdrop-filter:blur(16px);box-shadow:0 15px 40px #0003
}
.head{padding:17px;border-bottom:1px solid var(--line)}
.head h2{margin:0 0 14px}
input,textarea{
 width:100%;min-width:0;padding:12px 14px;color:white;
 background:#0b1424;border:1px solid #394861;
 border-radius:12px;outline:none
}
input:focus,textarea:focus{border-color:var(--blue)}
.scroll{overflow:auto;flex:1;min-height:0}
.person{
 width:100%;display:flex;gap:11px;align-items:center;
 padding:13px;color:var(--text);background:transparent;
 border:0;border-bottom:1px solid var(--line);text-align:left
}
.person:hover,.person.active{background:#34466b80}
.avatar{
 width:43px;height:43px;flex-shrink:0;display:grid;
 place-items:center;overflow:hidden;border-radius:14px;
 background:linear-gradient(135deg,#527cda,#a073d7);
 font-weight:800
}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0;flex:1}
.person-name,#peer{
 display:flex;align-items:center;gap:5px;
 flex-wrap:wrap;font-weight:800
}
#peer{font-size:16px}
.verified-icon{
 width:18px;height:18px;object-fit:contain
}
.preview{
 margin-top:5px;color:var(--muted);font-size:12px;
 overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}
.muted{font-size:12px;color:var(--muted)}
.empty{
 padding:28px;text-align:center;
 color:var(--muted);line-height:1.6
}
.chathead{
 display:flex;align-items:center;gap:12px;
 padding:14px;min-height:74px;border-bottom:1px solid var(--line)
}
#peerInfo{min-width:0;flex:1}
#peerStatus{margin-top:5px}
.online{color:#78e6b0}
.typing{color:#9db5ff}
.chattools{
 padding:9px 12px;border-bottom:1px solid var(--line)
}
.chattools input{padding:9px 11px}
#pinned{
 padding:10px 14px;background:#253657;
 border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:10px
}
#pinnedText{
 min-width:0;flex:1;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap
}
#messages{
 padding:12px 0;display:flex;flex-direction:column;
 scroll-behavior:smooth
}
.bubble{
 width:max-content;max-width:min(82%,500px);
 margin:5px 14px;padding:11px 14px;
 border:1px solid #ffffff12;
 border-radius:17px 17px 17px 5px;
 background:#293a59;overflow-wrap:anywhere;
 white-space:pre-wrap;animation:rise .2s ease
}
.bubble.mine{
 margin-left:auto;border-radius:17px 17px 5px 17px;
 background:linear-gradient(135deg,#465fc0,#705cb6)
}
.bubble small{
 display:block;margin-top:7px;text-align:right;
 opacity:.75;font-size:10px
}
.bubble.sticker{background:transparent;border:0}
.sticker img{
 width:150px;height:150px;max-width:100%;object-fit:contain
}
.message-actions{
 display:flex;flex-wrap:wrap;gap:5px;
 margin-top:8px
}
.message-actions button,.reaction{
 padding:5px 8px;color:#eaf1ff;
 background:#ffffff17;border:1px solid #ffffff17;
 border-radius:8px;font-size:11px
}
.message-actions button:hover,.reaction:hover{
 background:#ffffff30
}
.reactions{
 display:flex;flex-wrap:wrap;gap:5px;margin-top:7px
}
.reaction.selected{
 background:#91aaff50;border-color:#b5c7ff
}
.reply-preview{
 padding:7px 9px;margin-bottom:8px;
 border-left:3px solid #a4baff;
 background:#ffffff13;border-radius:5px;
 font-size:12px;opacity:.9
}
.compose-wrap{
 position:relative;border-top:1px solid var(--line)
}
.replybar{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:10px 14px;background:#223450;
 font-size:12px
}
#replyText{
 min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap
}
#form{
 display:flex;align-items:center;gap:8px;padding:12px
}
#message{flex:1}
.action,.primary{
 padding:11px 14px;border-radius:12px;color:#eaf1ff;
 border:1px solid #40506d;background:#20304c
}
.primary{
 border:0;background:linear-gradient(120deg,#4779eb,#8b74ef);
 font-weight:750
}
#stickerPanel{
 position:absolute;bottom:calc(100% + 5px);
 left:10px;z-index:5;
 width:min(360px,calc(100vw - 40px));
 max-height:340px;display:flex;flex-direction:column;
 overflow:hidden;border:1px solid #526487;
 border-radius:15px;background:#17243c;
 box-shadow:0 15px 45px #0009
}
.sticker-head{
 display:flex;gap:8px;padding:12px;
 border-bottom:1px solid var(--line)
}
.sticker-head select{
 flex:1;min-width:0;color:white;background:#0b1424;
 border:1px solid #394861;border-radius:9px;padding:8px
}
#stickerGrid{
 overflow:auto;padding:10px;display:grid;
 grid-template-columns:repeat(4,1fr);gap:8px
}
#stickerGrid button{
 padding:5px;background:#ffffff09;
 border:1px solid transparent;border-radius:10px
}
#stickerGrid img{
 width:100%;aspect-ratio:1;object-fit:contain
}
#error{
 padding:12px;color:#ffb9c0;
 background:#7a273035;font-size:12px
}
.loading{
 display:flex;align-items:center;justify-content:center;
 gap:10px;padding:24px;color:var(--muted)
}
.spinner{
 width:17px;height:17px;border-radius:50%;
 border:2px solid #ffffff25;border-top-color:#92b3ff;
 animation:spin .7s linear infinite
}
.dialog-overlay{
 position:fixed;inset:0;z-index:50;
 display:grid;place-items:center;padding:18px;
 background:#030712bc;backdrop-filter:blur(7px)
}
.dialog{
 width:min(440px,100%);padding:22px;
 background:#19253e;border:1px solid #ffffff30;
 border-radius:19px;box-shadow:0 20px 70px #0008
}
.dialog h3{margin:0 0 12px}
.dialog textarea{min-height:120px;resize:vertical}
.dialog-actions{
 display:flex;justify-content:flex-end;
 gap:9px;margin-top:15px
}
#back{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{
 from{opacity:0;transform:translateY(6px)}
 to{opacity:1;transform:translateY(0)}
}
@media(max-width:650px){
 header{padding:0 14px}
 #layout{
  display:block;height:calc(100dvh - 78px);
  margin:7px auto;padding:0 7px
 }
 .glass{height:100%}
 #layout:not(.open) #conversation,
 #layout.open #sidebar{display:none}
 #back{display:block}
 .bubble{max-width:88%}
 .message-actions button{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
 .bubble{animation:none}
 #messages{scroll-behavior:auto}
}
</style>
</head>
<body>
<header>
 <div class="brand">NEXORA <span>2.2</span></div>
 <a href="./index.html">← Главная</a>
</header>

<main id="layout">
 <section id="sidebar" class="glass">
  <div class="head">
   <h2>Сообщения</h2>
   <input id="search" placeholder="Поиск пользователей">
  </div>
  <div id="people" class="scroll"></div>
  <div class="head"><b>Мои диалоги</b></div>
  <div id="chats" class="scroll">
   <div class="loading">
    <span class="spinner"></span> Загрузка диалогов...
   </div>
  </div>
 </section>

 <section id="conversation" class="glass">
  <div class="chathead">
   <button id="back" class="action">←</button>
   <div id="peerAvatar" class="avatar">N</div>
   <div id="peerInfo">
    <div id="peer">Выбери собеседника</div>
    <div id="peerStatus" class="muted">
     Сообщения доступны участникам диалога
    </div>
   </div>
  </div>

  <div id="error" hidden></div>

  <div id="pinned" hidden>
   <span>📌</span>
   <span id="pinnedText"></span>
   <button id="unpin" class="action" type="button">×</button>
  </div>

  <div class="chattools">
   <input id="chatSearch" type="search"
    placeholder="Поиск в переписке">
  </div>

  <div id="messages" class="scroll">
   <div class="empty">Выбери диалог для общения</div>
  </div>

  <div class="compose-wrap">
   <div id="replyBar" class="replybar" hidden>
    <span id="replyText"></span>
    <button id="cancelReply" class="action" type="button">×</button>
   </div>

   <div id="stickerPanel" hidden>
    <div class="sticker-head">
     <select id="stickerPack"></select>
     <button id="closeStickers" class="action">✕</button>
    </div>
    <div id="stickerGrid"></div>
   </div>

   <form id="form">
    <button type="button" id="stickers"
     class="action" disabled>☺</button>
    <input id="message" maxlength="2000"
     placeholder="Сообщение..." disabled>
    <button id="send" class="primary" disabled>➤</button>
   </form>
  </div>
 </section>
</main>

<div id="editOverlay" class="dialog-overlay" hidden>
 <div class="dialog" role="dialog" aria-modal="true"
  aria-labelledby="editTitle">
  <h3 id="editTitle">Редактировать сообщение</h3>
  <textarea id="editText" maxlength="2000"></textarea>
  <div class="dialog-actions">
   <button id="editCancel" class="action">Отмена</button>
   <button id="editSave" class="primary">Сохранить</button>
  </div>
 </div>
</div>

<script type="module">
import {initializeApp} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {getAuth,onAuthStateChanged} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
 getFirestore,collection,doc,getDoc,getDocs,
 query,where,limit,orderBy,onSnapshot,
 writeBatch,serverTimestamp,setDoc,
 updateDoc,deleteDoc
} from
'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const cfg={
 apiKey:'AIzaSyD9prfvOQGMeniL3U8WD2HeeZ6NNArY8J8',
 authDomain:'toolchat-bfac8.firebaseapp.com',
 projectId:'toolchat-bfac8',
 storageBucket:'toolchat-bfac8.firebasestorage.app',
 messagingSenderId:'52396840735',
 appId:'1:52396840735:web:a608b9c037c8481f2dc22a'
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

let me=null;
let users={};
let activeUid=null;
let stopMessages=null;
let stopChats=null;
let stopPresence=null;
let stopTyping=null;
let currentMessages=[];
let chatRecords=[];
let typingTimeout=null;
let typingActive=false;
let reading=false;
let chatGeneration=0;
let peerOnline=false;
let peerTyping=false;
let replyTo=null;
let editingId=null;
let pinnedId=null;
let pinnedText='';
let actionBusy=false;

const EMOJIS=['❤️','👍','😂','😮','😢','🔥'];

const escapeHTML=value=>String(value??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'
 })[c]
);

function chatId(a,b){
 return [a,b].sort().join('_');
}

function currentChatId(){
 return activeUid&&me?chatId(me.uid,activeUid):null;
}

function safeImage(url){
 try{
  const parsed=new URL(url);
  return parsed.protocol==='https:' &&
   !parsed.username&&!parsed.password?parsed.href:'';
 }catch{return ''}
}

function avatar(user){
 const url=safeImage(user?.avatarUrl);
 return url
  ?`<img src="${escapeHTML(url)}" alt=""
    loading="lazy" referrerpolicy="no-referrer"
    onerror="this.remove()">`
  :escapeHTML((user?.name||'N').slice(0,2).toUpperCase());
}

function badge(user){
 const v=Number(user?.verification||0);
 return v>=1&&v<=5
  ?`<img class="verified-icon"
    src="./image/Verified_${v}.png"
    alt="Верификация"
    title="Верифицированный аккаунт"
    onerror="this.remove()">`
  :'';
}

function personRow(uid,preview=''){
 const user=users[uid]||{};
 return `
  <button class="person ${uid===activeUid?'active':''}"
    data-user="${escapeHTML(uid)}">
   <span class="avatar">${avatar(user)}</span>
   <span class="person-info">
    <span class="person-name">
     ${escapeHTML(user.name||'Пользователь')}
     ${badge(user)}
    </span>
    <div class="preview">${escapeHTML(preview)}</div>
   </span>
  </button>
 `;
}

function showError(message){
 $('error').hidden=false;
 $('error').textContent=message;
}

function clearError(){
 $('error').hidden=true;
 $('error').textContent='';
}

function searchUsers(){
 if(!me)return;

 const term=$('search').value.toLowerCase().trim();

 if(!term){
  $('people').innerHTML='';
  return;
 }

 const matches=Object.keys(users)
  .filter(uid=>
   uid!==me.uid &&
   (users[uid].name||'').toLowerCase().includes(term)
  )
  .slice(0,30);

 $('people').innerHTML=matches.map(
  uid=>personRow(uid,'Начать диалог')
 ).join('')||
 '<div class="empty">Ничего не найдено</div>';
}

$('search').oninput=searchUsers;

document.addEventListener('click',event=>{
 const button=event.target.closest('[data-user]');
 if(button)openChat(button.dataset.user);
});

function updatePeerStatus(){
 if(!activeUid)return;

 const element=$('peerStatus');

 if(peerTyping){
  element.textContent='Печатает...';
  element.className='muted typing';
 }else if(peerOnline){
  element.textContent='● Недавно был активен';
  element.className='muted online';
 }else{
  element.textContent='○ Не в сети';
  element.className='muted';
 }
}

function clearReply(){
 replyTo=null;
 $('replyBar').hidden=true;
}

function stopActive(){
 stopMessages?.();
 stopPresence?.();
 stopTyping?.();

 stopMessages=null;
 stopPresence=null;
 stopTyping=null;

 clearTimeout(typingTimeout);
 typingActive=false;
 peerOnline=false;
 peerTyping=false;
 currentMessages=[];
 pinnedId=null;
 pinnedText='';
 editingId=null;
 clearReply();

 $('pinned').hidden=true;
 $('chatSearch').value='';
 $('editOverlay').hidden=true;

 chatGeneration++;
}

function renderChatList(){
 if(!me)return;

 $('chats').innerHTML=chatRecords.map(item=>{
  const data=item.data();
  const other=data.participants?.find(
   uid=>uid!==me.uid
  );

  return other
   ?personRow(other,data.lastText||'Диалог')
   :'';
 }).join('')||
 '<div class="empty">Диалогов пока нет</div>';
}

function renderPinned(){
 $('pinned').hidden=!pinnedId;
 $('pinnedText').textContent=pinnedText||'Сообщение';
}

async function openChat(uid){
 if(!me||uid===me.uid)return;

 stopActive();
 activeUid=uid;
 const generation=chatGeneration;

 clearError();
 $('layout').classList.add('open');
 $('message').disabled=true;
 $('send').disabled=true;
 $('stickers').disabled=true;

 $('messages').innerHTML=`
  <div class="loading">
   <span class="spinner"></span>
   Загрузка сообщений...
  </div>
 `;

 if(!users[uid]){
  try{
   const snapshot=await getDoc(doc(db,'users',uid));

   if(!snapshot.exists()){
    throw Error('Пользователь не найден');
   }

   if(generation!==chatGeneration)return;
   users[uid]=snapshot.data();
  }catch(error){
   if(generation===chatGeneration){
    showError(error.message);
   }
   return;
  }
 }

 if(generation!==chatGeneration)return;

 const peerUser=users[uid];

 $('peer').innerHTML=`
  <span>${escapeHTML(peerUser.name||'Пользователь')}</span>
  ${badge(peerUser)}
 `;

 $('peerAvatar').innerHTML=avatar(peerUser);
 $('message').disabled=false;
 $('send').disabled=false;
 $('stickers').disabled=false;

 renderChatList();
 searchUsers();

 const id=chatId(me.uid,uid);

 stopPresence=onSnapshot(
  doc(db,'presence',uid),
  snapshot=>{
   if(generation!==chatGeneration)return;

   const lastSeen=snapshot.data()?.lastSeen?.toMillis?.();

   peerOnline=Boolean(
    lastSeen&&Math.abs(Date.now()-lastSeen)<120000
   );

   updatePeerStatus();
  },
  ()=>{}
 );

 stopTyping=onSnapshot(
  doc(db,'chats',id,'typing',uid),
  snapshot=>{
   if(generation!==chatGeneration)return;

   const data=snapshot.data();
   const last=data?.updatedAt?.toMillis?.()||0;

   peerTyping=Boolean(
    data?.typing&&last&&Math.abs(Date.now()-last)<10000
   );

   updatePeerStatus();
  },
  error=>console.warn('Typing:',error.message)
 );

 stopMessages=onSnapshot(
  query(
   collection(db,'chats',id,'messages'),
   orderBy('createdAt','asc'),
   limit(100)
  ),
  snapshot=>{
   if(generation!==chatGeneration)return;

   currentMessages=snapshot.docs.map(item=>({
    id:item.id,...item.data()
   }));

   renderMessages();
   markRead(id,uid);
  },
  error=>showError(
   'Не удалось загрузить переписку: '+error.message
  )
 );

 // Закрепление хранится в документе самого диалога.
 const chatRef=doc(db,'chats',id);

 const unsubscribePin=onSnapshot(
  chatRef,
  snapshot=>{
   if(generation!==chatGeneration)return;

   pinnedId=snapshot.data()?.pinnedMessageId||null;
   pinnedText=snapshot.data()?.pinnedText||'';
   renderPinned();
  },
  error=>console.warn('Pinned:',error.message)
 );

 const previousStop=stopMessages;
 stopMessages=()=>{
  previousStop?.();
  unsubscribePin();
 };
}

function stickerSource(key){
 if(typeof key!=='string')return '';

 const parts=key.split('/');
 if(parts.length!==2)return '';

 const pack=STICKER_PACKS.find(p=>p.id===parts[0]);

 if(!pack||!pack.files.includes(parts[1]))return '';

 return './image/stic/'+parts[0]+'/'+parts[1];
}

function renderMessages(){
 const box=$('messages');
 const term=$('chatSearch').value.trim().toLowerCase();

 const visible=term
  ?currentMessages.filter(message=>
    String(message.text||'').toLowerCase().includes(term)
   )
  :currentMessages;

 box.innerHTML=visible.map(message=>{
  const mine=message.senderId===me.uid;
  const isSticker=message.type==='sticker';
  const src=isSticker?stickerSource(message.sticker):'';

  const time=message.createdAt?.toDate?.()
   .toLocaleTimeString('ru-RU',{
    hour:'2-digit',minute:'2-digit'
   })||'';

  const content=isSticker
   ?src
    ?`<img src="${escapeHTML(src)}" alt="Стикер">`
    :'<span>Стикер недоступен</span>'
   :escapeHTML(message.text||'');

  const reactions=message.reactions||{};
  const reactionButtons=EMOJIS.map(emoji=>{
   const ids=Array.isArray(reactions[emoji])
    ?reactions[emoji]:[];

   const selected=ids.includes(me.uid);

   return `
    <button class="reaction ${selected?'selected':''}"
     data-react="${escapeHTML(emoji)}"
     data-id="${escapeHTML(message.id)}">
     ${emoji}${ids.length?' '+ids.length:''}
    </button>
   `;
  }).join('');

  return `
   <div class="bubble ${mine?'mine':''}
    ${isSticker?'sticker':''}"
    data-message="${escapeHTML(message.id)}">

    ${message.replyText?`
     <div class="reply-preview">
      ↩ ${escapeHTML(message.replyText)}
     </div>
    `:''}

    ${content}

    <small>
     ${escapeHTML(time)}
     ${message.editedAt?' · Изменено':''}
     ${mine
      ?message.readAt?' · Прочитано':' · Отправлено'
      :''}
    </small>

    <div class="reactions">${reactionButtons}</div>

    <div class="message-actions">
     <button data-action="reply"
      data-id="${escapeHTML(message.id)}">↩ Ответить</button>

     <button data-action="pin"
      data-id="${escapeHTML(message.id)}">📌</button>

     ${mine&&!isSticker?`
      <button data-action="edit"
       data-id="${escapeHTML(message.id)}">
       Изменить
      </button>
     `:''}

     ${mine?`
      <button data-action="delete"
       data-id="${escapeHTML(message.id)}">
       Удалить
      </button>
     `:''}
    </div>
   </div>
  `;
 }).join('')||
 '<div class="empty">Сообщения не найдены</div>';

 if(!term)box.scrollTop=box.scrollHeight;
}

$('chatSearch').addEventListener('input',renderMessages);

function findMessage(id){
 return currentMessages.find(message=>message.id===id);
}

function messageRef(id){
 return doc(db,'chats',currentChatId(),'messages',id);
}

$('messages').addEventListener('click',async event=>{
 const reaction=event.target.closest('[data-react]');

 if(reaction){
  await toggleReaction(
   reaction.dataset.id,
   reaction.dataset.react
  );
  return;
 }

 const button=event.target.closest('[data-action]');
 if(!button)return;

 const message=findMessage(button.dataset.id);
 if(!message)return;

 switch(button.dataset.action){
  case 'reply':
   replyTo=message;
   $('replyText').textContent=
    'Ответ на: '+String(message.text||'Стикер').slice(0,110);
   $('replyBar').hidden=false;
   $('message').focus();
   break;

  case 'edit':
   if(message.senderId!==me.uid)return;
   editingId=message.id;
   $('editText').value=message.text||'';
   $('editOverlay').hidden=false;
   $('editText').focus();
   break;

  case 'delete':
   await removeMessage(message);
   break;

  case 'pin':
   await pinMessage(message);
   break;
 }
});

async function toggleReaction(id,emoji){
 if(!me||!activeUid||actionBusy)return;
 if(!EMOJIS.includes(emoji))return;

 const message=findMessage(id);
 if(!message)return;

 actionBusy=true;

 try{
  const ref=messageRef(id);
  const snapshot=await getDoc(ref);

  if(!snapshot.exists()){
   throw Error('Сообщение не найдено');
  }

  const reactions=snapshot.data().reactions||{};
  const ids=Array.isArray(reactions[emoji])
   ?reactions[emoji]:[];

  const next=ids.includes(me.uid)
   ?ids.filter(uid=>uid!==me.uid)
   :[...ids,me.uid];

  await updateDoc(ref,{
   [`reactions.${emoji}`]:next
  });
 }catch(error){
  showError('Ошибка реакции: '+error.message);
 }finally{
  actionBusy=false;
 }
}

async function removeMessage(message){
 if(message.senderId!==me.uid)return;

 if(!confirm('Удалить это сообщение?'))return;

 try{
  await deleteDoc(messageRef(message.id));

  if(pinnedId===message.id){
   await updateDoc(
    doc(db,'chats',currentChatId()),
    {pinnedMessageId:null,pinnedText:''}
   );
  }
 }catch(error){
  showError('Ошибка удаления: '+error.message);
 }
}

async function pinMessage(message){
 if(!me||!activeUid)return;

 try{
  await updateDoc(
   doc(db,'chats',currentChatId()),
   {
    pinnedMessageId:message.id,
    pinnedText:String(
     message.text||'Стикер'
    ).slice(0,160)
   }
  );
 }catch(error){
  showError('Ошибка закрепления: '+error.message);
 }
}

$('unpin').onclick=async()=>{
 if(!currentChatId())return;

 try{
  await updateDoc(
   doc(db,'chats',currentChatId()),
   {pinnedMessageId:null,pinnedText:''}
  );
 }catch(error){
  showError('Ошибка открепления: '+error.message);
 }
};

$('editCancel').onclick=()=>{
 editingId=null;
 $('editOverlay').hidden=true;
};

$('editSave').onclick=async()=>{
 if(!editingId||!me)return;

 const text=$('editText').value.trim();
 const message=findMessage(editingId);

 if(!message||message.senderId!==me.uid)return;

 if(!text||text.length>2000){
  showError('Введите текст до 2000 символов');
  return;
 }

 $('editSave').disabled=true;

 try{
  await updateDoc(messageRef(editingId),{
   text,
   editedAt:serverTimestamp()
  });

  editingId=null;
  $('editOverlay').hidden=true;
 }catch(error){
  showError('Ошибка редактирования: '+error.message);
 }finally{
  $('editSave').disabled=false;
 }
};

$('cancelReply').onclick=clearReply;

async function markRead(id,peerUid){
 if(reading||!me||activeUid!==peerUid)return;

 const unread=currentMessages.filter(message=>
  message.senderId===peerUid&&!message.readAt
 );

 if(!unread.length)return;

 reading=true;

 try{
  const batch=writeBatch(db);

  unread.forEach(message=>{
   batch.update(
    doc(db,'chats',id,'messages',message.id),
    {readAt:serverTimestamp()}
   );
  });

  await batch.commit();
 }catch(error){
  console.warn('Read receipts:',error.message);
 }finally{
  reading=false;
 }
}

async function ensureChat(uid){
 const id=chatId(me.uid,uid);
 const ref=doc(db,'chats',id);
 const snapshot=await getDoc(ref);

 if(!snapshot.exists()){
  await setDoc(ref,{
   participants:[me.uid,uid].sort(),
   updatedAt:serverTimestamp(),
   lastText:''
  });
 }

 return id;
}

async function sendMessage(payload){
 if(!me||!activeUid)return;

 const uid=activeUid;
 const id=await ensureChat(uid);

 if(activeUid!==uid)return;

 const batch=writeBatch(db);

 const preview=payload.type==='sticker'
  ?'Стикер'
  :(payload.text||'').slice(0,100);

 batch.set(
  doc(db,'chats',id),
  {
   participants:[me.uid,uid].sort(),
   updatedAt:serverTimestamp(),
   lastText:preview
  },
  {merge:true}
 );

 const data={
  senderId:me.uid,
  type:payload.type||'text',
  text:payload.text||'',
  sticker:payload.sticker||'',
  createdAt:serverTimestamp()
 };

 if(payload.replyText){
  data.replyText=payload.replyText;
  data.replyTo=payload.replyTo;
 }

 batch.set(
  doc(collection(db,'chats',id,'messages')),
  data
 );

 await batch.commit();
}

$('form').onsubmit=async event=>{
 event.preventDefault();

 const text=$('message').value.trim();

 if(!text||text.length>2000)return;

 $('send').disabled=true;

 try{
  const payload={type:'text',text};

  if(replyTo){
   payload.replyTo=replyTo.id;
   payload.replyText=String(
    replyTo.text||'Стикер'
   ).slice(0,160);
  }

  await sendMessage(payload);

  $('message').value='';
  clearReply();
  await setTyping(false);
 }catch(error){
  showError('Ошибка отправки: '+error.message);
 }finally{
  $('send').disabled=false;
 }
};

async function setTyping(value){
 if(!me||!activeUid)return;
 if(typingActive===value)return;

 const uid=activeUid;
 typingActive=value;

 try{
  const id=await ensureChat(uid);

  if(activeUid!==uid)return;

  await setDoc(
   doc(db,'chats',id,'typing',me.uid),
   {
    uid:me.uid,
    typing:value,
    updatedAt:serverTimestamp()
   }
  );
 }catch(error){
  typingActive=false;
  console.warn('Typing:',error.message);
 }
}

$('message').addEventListener('input',()=>{
 if(!activeUid)return;

 setTyping(Boolean($('message').value.trim()));

 clearTimeout(typingTimeout);

 typingTimeout=setTimeout(()=>{
  setTyping(false);
 },2500);
});

$('back').onclick=()=>{
 $('layout').classList.remove('open');
 $('stickerPanel').hidden=true;
};

const STICKER_PACKS=[
 {
  id:'kemomimiori',
  title:'Kemomimiori',
  files:[]
 }
];

function renderStickerPacks(){
 $('stickerPack').innerHTML=STICKER_PACKS.map(pack=>`
  <option value="${escapeHTML(pack.id)}">
   ${escapeHTML(pack.title)}
  </option>
 `).join('');

 renderStickers();
}

function renderStickers(){
 const pack=STICKER_PACKS.find(
  p=>p.id===$('stickerPack').value
 );

 if(!pack||!pack.files.length){
  $('stickerGrid').innerHTML=
   '<p class="muted">Стикеры пока не загружены</p>';
  return;
 }

 $('stickerGrid').innerHTML=pack.files.map(file=>{
  const key=pack.id+'/'+file;
  const src=stickerSource(key);

  return `
   <button type="button"
    data-sticker="${escapeHTML(key)}">
    <img src="${escapeHTML(src)}"
     alt="Стикер" loading="lazy">
   </button>
  `;
 }).join('');
}

$('stickerPack').onchange=renderStickers;

$('stickers').onclick=()=>{
 $('stickerPanel').hidden=!$('stickerPanel').hidden;
};

$('closeStickers').onclick=()=>{
 $('stickerPanel').hidden=true;
};

$('stickerGrid').addEventListener(
 'click',async event=>{
  const button=event.target.closest('[data-sticker]');

  if(!button||!activeUid)return;

  button.disabled=true;

  try{
   await sendMessage({
    type:'sticker',
    sticker:button.dataset.sticker
   });

   $('stickerPanel').hidden=true;
  }catch(error){
   showError('Ошибка стикера: '+error.message);
  }finally{
   button.disabled=false;
  }
 }
);

renderStickerPacks();

onAuthStateChanged(auth,async user=>{
 stopChats?.();
 stopChats=null;

 stopActive();
 activeUid=null;
 me=user;

 if(!user){
  $('layout').innerHTML=`
   <section class="glass" style="padding:25px">
    <h2>Требуется вход</h2>
    <p>Авторизуйся для просмотра сообщений.</p>
    <a href="./index.html">На главную</a>
   </section>
  `;
  return;
 }

 stopChats=onSnapshot(
  query(
   collection(db,'chats'),
   where('participants','array-contains',user.uid),
   limit(100)
  ),
  snapshot=>{
   chatRecords=snapshot.docs.sort((a,b)=>
    (b.data().updatedAt?.seconds||0)-
    (a.data().updatedAt?.seconds||0)
   );

   renderChatList();
  },
  error=>showError(
   'Ошибка списка диалогов: '+error.message
  )
 );

 try{
  const snapshot=await getDocs(query(
   collection(db,'users'),
   limit(100)
  ));

  if(auth.currentUser?.uid!==user.uid)return;

  users={};

  snapshot.forEach(item=>{
   users[item.id]=item.data();
  });

  renderChatList();
  searchUsers();

  const requested=new URLSearchParams(
   location.search
  ).get('user');

  if(requested&&requested!==user.uid){
   await openChat(requested);
  }
 }catch(error){
  showError(
   'Ошибка загрузки пользователей: '+error.message
  );
 }
});
</script>
