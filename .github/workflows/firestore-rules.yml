name: Firebase integration
on:
  push:
    paths:
      - 'firestore.rules'
      - 'docs/firebase/**'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '*.js'
      - '*.html'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'docs/firebase/**'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '*.js'
      - '*.html'
      - 'functions/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/firestore-rules.yml'
permissions:
  contents: read
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix functions --no-audit --no-fund
      - run: node -e "require('./functions/index.js')"
      - run: npm test
